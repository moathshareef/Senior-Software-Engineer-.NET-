<style>
/* Layout: sticky "order ticket" header with live stats + tab rail; one working column of panels below (max 1080px). */
:root {
  --bg: #f2f5f8; --surface: #ffffff; --surface-2: #e9eef3; --line: #d3dbe3; --line-strong: #b4c0cc;

  --shadow: 0 1px 2px rgba(19,33,48,.06), 0 4px 16px rgba(19,33,48,.05);
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141a; --surface: #151d25; --surface-2: #1b2530; --line: #283644; --line-strong: #3a4b5c;
  --fg: #e4ebf2; --muted: #93a3b4; --accent: #6fa6ff; --accent-ink: #0b1420; --accent-soft: #1a2c46;
  --amber: #f0a93a; --amber-soft: #3a2a12; --good: #52c58c; --good-soft: #15301f; --bad: #ff8178; --bad-soft: #3a1a18;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #151d25; --surface-2: #1b2530; --line: #283644; --line-strong: #3a4b5c;
  --fg: #e4ebf2; --muted: #93a3b4; --accent: #6fa6ff; --accent-ink: #0b1420; --accent-soft: #1a2c46;
  --amber: #f0a93a; --amber-soft: #3a2a12; --good: #52c58c; --good-soft: #15301f; --bad: #ff8178; --bad-soft: #3a1a18;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: .005em; }
h1 { font-size: 1.35rem; font-weight: 700; }
h2 { font-size: 1.25rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
code { font-family: var(--f-mono); font-size: .86em; background: var(--surface-2); padding: .05em .35em; border-radius: 4px; overflow-wrap: anywhere; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.label { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 12px 8px; }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1 1 220px; }
.brand .sub { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.top-actions { display: flex; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: .72rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill.ok .dot { background: var(--good); } .pill.busy .dot { background: var(--amber); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: .82rem; }
.iconbtn:hover { border-color: var(--line-strong); }
.ticker { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
.tick { background: var(--surface); padding: 6px 10px; min-width: 0; }
.tick b { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.tick span { font-family: var(--f-mono); font-size: .66rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.tick.streak b { color: var(--amber); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { border: 0; background: none; padding: 8px 12px; border-bottom: 2px solid transparent; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
@media (max-width: 640px) { .ticker { grid-template-columns: repeat(3, minmax(0,1fr)); } .tick.hide-sm { display: none; } }

main { padding-block: 20px 64px; display: grid; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel.flat { background: transparent; border: 0; padding: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 16px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
.stack { display: grid; gap: 10px; align-content: start; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }

.btn { border: 1px solid var(--line-strong); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.good { border-color: var(--good); color: var(--good); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: .85rem; }
.btn[disabled] { opacity: .5; cursor: default; }
input[type=text], input[type=search], input[type=number], select, textarea { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 10px; min-width: 0; }
textarea { width: 100%; resize: vertical; min-height: 84px; line-height: 1.45; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; margin: 2px 0 0; cursor: pointer; }

.chip { display: inline-flex; align-items: center; font-family: var(--f-mono); font-size: .68rem; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.must { color: var(--bad); border-color: currentColor; } .chip.should { color: var(--amber); border-color: currentColor; } .chip.nice { color: var(--muted); }
.chip.deep { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.project { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.review { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.chip.rc { color: var(--amber); border-color: currentColor; }

.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.bar.good > i { background: var(--good); } .bar.amber > i { background: var(--amber); }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } .flip-inner { transition: none !important; } }

/* today */
.hello { display: grid; gap: 6px; }
.hello .msg { font-family: var(--f-display); font-size: 1.3rem; font-weight: 500; line-height: 1.3; max-width: 60ch; }
.focus-card { border-left: 4px solid var(--accent); }
.focus-card.done { border-left-color: var(--good); }
.focus-topic { font-family: var(--f-display); font-size: 1.2rem; font-weight: 600; line-height: 1.3; }
.ex { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.ex .label { display: block; margin-bottom: 2px; }

/* lists */
.item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .txt { min-width: 0; flex: 1; }
.item.done .txt { color: var(--muted); }
details.sec { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
details.sec + details.sec { margin-top: 10px; }
details.sec > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary .t { flex: 1; min-width: 0; }
details.sec > summary .caret { font-family: var(--f-mono); color: var(--muted); transition: transform .2s; }
details.sec[open] > summary .caret { transform: rotate(90deg); }
details.sec .body { padding: 0 16px 14px; }
.sumbar { width: 90px; flex: none; }
@media (max-width: 520px) { .sumbar { width: 54px; } }
.grp { margin-top: 10px; }
.grp > .label { display: block; margin: 8px 0 2px; }

/* roadmap */
.day { display: grid; grid-template-columns: auto 92px minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.day:first-of-type { border-top: 0; }
.day .date { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); padding-top: 1px; }
.day.today { background: var(--accent-soft); margin-inline: -16px; padding-inline: 16px; }
.day.done .tp { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.day .tp { font-weight: 500; }
.day .exl { font-size: .88rem; color: var(--muted); margin-top: 2px; }
.day .hrs { display: flex; align-items: center; gap: 4px; }
.day .hrs input { width: 62px; padding: 3px 6px; font-family: var(--f-mono); font-size: .85rem; }
@media (max-width: 600px) { .day { grid-template-columns: auto minmax(0,1fr); } .day .date { grid-column: 2; order: -1; } .day .hrs { grid-column: 2; } }
.weekcells { display: grid; grid-template-columns: repeat(13, minmax(0,1fr)); gap: 4px; }
.weekcell { display: grid; gap: 4px; text-align: center; }
.weekcell .c { aspect-ratio: 1; max-width: 100%; border-radius: 6px; background: var(--surface-2); position: relative; overflow: hidden; border: 1px solid var(--line); }
.weekcell .c i { position: absolute; inset: auto 0 0 0; background: var(--accent); }
.weekcell.cur .c { outline: 2px solid var(--amber); outline-offset: 1px; }
.weekcell span { font-family: var(--f-mono); font-size: .62rem; color: var(--muted); }
.stars { display: inline-flex; gap: 2px; }
.stars button { border: 1px solid var(--line); background: var(--surface); width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-family: var(--f-mono); font-size: .85rem; color: var(--muted); }
.stars button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* topics */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
@media (max-width: 400px) { .cards { grid-template-columns: 1fr; } }
.tcard { display: grid; gap: 10px; align-content: start; }
.tcard ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.tcard .res a { display: inline-block; margin-right: 10px; font-size: .9rem; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; cursor: pointer; font-size: .82rem; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters input[type=search] { flex: 1 1 220px; }

/* stories */
.story { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px 16px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.story:first-child { border-top: 0; }
.timer { font-family: var(--f-mono); font-size: 1.15rem; font-variant-numeric: tabular-nums; min-width: 4ch; }
.timer.over { color: var(--bad); }
.story .ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 600px) { .story { grid-template-columns: 1fr; } .story .ctl { justify-content: flex-start; } }

/* practice */
.decks { display: flex; gap: 6px; flex-wrap: wrap; }
.decks button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: .85rem; }
.decks button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.flip { perspective: 1200px; cursor: pointer; }
.flip-inner { position: relative; min-height: 210px; transition: transform .45s ease; transform-style: preserve-3d; }
.flip.show .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 22px; display: grid; align-content: center; gap: 8px; }
.face.back { transform: rotateY(180deg); background: var(--accent-soft); }
.face .q { font-family: var(--f-display); font-size: 1.25rem; font-weight: 600; line-height: 1.3; }
.opt { display: block; width: 100%; text-align: left; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 10px 12px; cursor: pointer; margin-top: 8px; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }

/* guide */
.toc { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 8px; }
.toc button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; }
.toc button:hover { border-color: var(--accent); }
.toc b { font-family: var(--f-display); font-weight: 600; }
.part { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.gsec { scroll-margin-top: 190px; display: grid; gap: 12px; }
.prose { display: grid; gap: 12px; min-width: 0; }
.prose > * { margin: 0; max-width: 78ch; }
.prose h2 { font-size: 1.25rem; margin-top: 10px; }
.prose h3 { font-size: 1.08rem; margin-top: 8px; }
.prose ul, .prose ol { padding-left: 20px; display: grid; gap: 4px; }
.prose pre { max-width: 100%; overflow-x: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-size: .82rem; line-height: 1.45; }
.prose pre code { background: none; padding: 0; font-size: inherit; }
.tw { overflow-x: auto; max-width: 100%; }
.tw table, .prose table { border-collapse: collapse; font-size: .88rem; min-width: 100%; }
.prose th, .prose td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
.prose th { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.gsec > * { min-width: 0; }
@media (max-width: 640px) { .gsec { scroll-margin-top: 250px; } }
.diagram img { display: block; width: 100%; max-width: 100%; height: auto; }
.diagram { background: #ffffff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.steps { counter-reset: st; list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 10px; align-items: start; }
.steps li::before { content: counter(st); font-family: var(--f-mono); font-weight: 500; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: .85rem; }
.kv { display: grid; grid-template-columns: minmax(110px, 160px) minmax(0,1fr); gap: 8px 16px; }
.kv dt { font-weight: 600; } .kv dd { margin: 0; }
@media (max-width: 520px) { .kv { grid-template-columns: 1fr; } .kv dd { margin-bottom: 6px; } }
.reftable th, .reftable td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; font-size: .9rem; }
.reftable th { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.reftable { border-collapse: collapse; min-width: 100%; }
.weekhead { display: grid; gap: 4px; padding-top: 14px; border-top: 2px solid var(--line); }
.weekhead:first-child { border-top: 0; padding-top: 0; }

/* badges */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.badge { border: 1px dashed var(--line-strong); border-radius: 8px; padding: 10px; display: grid; gap: 2px; opacity: .55; }
.badge.won { opacity: 1; border-style: solid; border-color: var(--amber); background: var(--amber-soft); }
.badge b { font-family: var(--f-display); font-weight: 600; }
.badge span { font-size: .8rem; color: var(--muted); }

.banner { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: .9rem; }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: .9rem; z-index: 50; max-width: calc(100% - 32px); }
.empty { color: var(--muted); padding: 12px 0; }
.result { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.result:first-child { border-top: 0; }
</style>

API, Postgres, Redis and RabbitMQ in one AppHost, with Aspire.Hosting.Testing integration tests"}, {"w": 5, "title": "Kubernetes", "mini": "Deploy the Aspire app to a local cluster with Helm, with a KEDA-autoscaled RabbitMQ consumer"}, {"w": 6, "title": "CI/CD and Infrastructure as Code", "mini": "Pipeline: GitHub Actions build → test → image → Bicep deploy to Azure Container Apps (dev), with OIDC and an approval gate"}, {"w": 7, "title": "Azure core services and serverless", "mini": "Settlement Saga: Durable Functions orchestration triggered by Service Bus, with compensation steps, deployed through GitHub Actions"}, {"w": 8, "title": "Cloud security and cost, then LLM foundations", "mini": "Trade Explainer: an endpoint that explains a blotter row with structured output and citations, behind Microsoft.Extensions.AI with caching and telemetry"}, {"w": 9, "title": "RAG, tool calling and MCP", "mini": "Compliance RAG: Q&A over a trading-policy rulebook with pgvector, citations, an evaluation suite, and an MCP server with read-only portfolio tools"}, {"w": 10, "title": "Agents, LLM ops and AI in fintech", "mini": "Risk Analyst Agent: an Agent Framework workflow (data agent + compliance agent) with a human approval step and full tracing"}, {"w": 11, "title": "System design and capstone start", "mini": "Capstone sprint 1: TradeDesk AI domain, APIs and Aspire skeleton running end to end"}, {"w": 12, "title": "Capstone finish and career", "mini": "Capstone: TradeDesk AI deployed to Azure Container Apps through GitHub Actions, with a demo video"}], "topics": [{"id": "cs12-14", "area": "Modern .NET & C#", "title": "C# 12, 13 and 14 features", "pri": "Must", "hrs": 6, "why": "Interviewers now expect C# 12–14 idioms in live coding, and modern codebases already use them. Not knowing primary constructors or collection expressions signals you stopped at .NET 8.", "concepts": ["Primary constructors and collection expressions (12)", "params collections, System.Threading.Lock, partial properties (13)", "Extension members, field keyword, null-conditional assignment, implicit span conversions (14)"], "res": [["What's new in C# 14", "https://learn.microsoft.com/dotnet/csharp/whats-new/csharp-14"], ["What's new in C# 13", "https://learn.microsoft.com/dotnet/csharp/whats-new/csharp-13"], ["What's new in C# 12", "https://learn.microsoft.com/dotnet/csharp/whats-new/csharp-12"]], "you": "Refactor a MediatR handler and your extension-method helpers to see the difference."}, {"id": "cs15", "area": "Modern .NET & C#", "title": "C# 15: unions and closed hierarchies (release candidate)", "pri": "Should", "hrs": 3, "why": "Union types are the biggest modeling change in C# in years and replace libraries like OneOf and ErrorOr. Present them as release candidate until .NET 11 GA in November 2026.", "concepts": ["union declarations and exhaustive switch", "closed classes: same-assembly derivation, implicitly abstract", "Collection expression arguments, extension indexers, labeled break/continue"], "res": [["What's new in C# 15", "https://learn.microsoft.com/dotnet/csharp/whats-new/csharp-15"], ["What's new in .NET 11", "https://learn.microsoft.com/dotnet/core/whats-new/dotnet-11/overview"]], "you": "Model order rejection reasons (risk, margin, market closed) as a union instead of exceptions."}, {"id": "net10", "area": "Modern .NET & C#", "title": ".NET 9 and 10 runtime and library changes", "pri": "Must", "hrs": 4, "why": ".NET 10 is the LTS everyone is moving to. Knowing what changed in the runtime and BCL lets you justify the upgrade with numbers.", "concepts": ["JIT: escape analysis, devirtualization, Dynamic PGO", "GC DATAS for containers", "Task.WhenEach, CountBy/AggregateBy, Guid.CreateVersion7, SearchValues, FrozenDictionary"], "res": [["What's new in .NET 10", "https://learn.microsoft.com/dotnet/core/whats-new/dotnet-10/overview"], ["Performance improvements in .NET 10", "https://devblogs.microsoft.com/dotnet/performance-improvements-in-net-10/"]], "you": "Benchmark one hot path from your trading core on .NET 8 vs .NET 10."}, {"id": "upgrade", "area": "Modern .NET & C#", "title": "Upgrading .NET 8 to .NET 10 LTS", "pri": "Must", "hrs": 5, "why": ".NET 8 and .NET 9 both lose support on Nov 10, 2026, so every .NET shop is doing this now. It is a perfect interview story and a direct extension of your migration work.", "concepts": ["TFM, global.json, Directory.Build.props, central package management", "Breaking-change review per area (ASP.NET Core, EF Core, SDK)", "GitHub Copilot app modernization agent (Upgrade Assistant is deprecated)"], "res": [["Breaking changes in .NET 10", "https://learn.microsoft.com/dotnet/core/compatibility/10.0"], ["GitHub Copilot app modernization", "https://learn.microsoft.com/dotnet/core/porting/github-copilot-app-modernization/overview"]], "you": "Pair with your strangler-fig migration story: same discipline, smaller blast radius."}, {"id": "aspnet10", "area": "Modern .NET & C#", "title": "ASP.NET Core 10: OpenAPI, validation, SSE, passkeys", "pri": "Must", "hrs": 6, "why": "Templates no longer ship Swashbuckle, and minimal APIs gained built-in validation. Senior API work in 2026 assumes these defaults.", "concepts": ["Microsoft.AspNetCore.OpenApi (OpenAPI 3.1), Scalar or Swagger UI as add-ons", "AddValidation() for minimal APIs, TypedResults, endpoint filters", "Server-Sent Events, passkeys in Identity"], "res": [["What's new in ASP.NET Core 10", "https://learn.microsoft.com/aspnet/core/release-notes/aspnetcore-10.0"], ["OpenAPI in ASP.NET Core", "https://learn.microsoft.com/aspnet/core/fundamentals/openapi/overview"]], "you": "Your typed SvelteKit client already mirrors OpenAPI, so you know why the contract matters."}, {"id": "hybridcache", "area": "Modern .NET & C#", "title": "HybridCache and output caching", "pri": "Must", "hrs": 2, "why": "HybridCache is now the default caching API: L1 in-memory plus L2 distributed with stampede protection. It replaces hand-rolled cache-aside code.", "concepts": ["GetOrCreateAsync with stampede protection", "L1/L2, serialization, tags and invalidation", "Output caching vs response caching vs data caching"], "res": [["HybridCache library", "https://learn.microsoft.com/aspnet/core/performance/caching/hybrid"]], "you": "Compare with your in-memory hierarchy cache that removed ~3,600 queries per event."}, {"id": "aspire", "area": "Modern .NET & C#", "title": "Aspire (formerly .NET Aspire)", "pri": "Must", "hrs": 10, "why": "Aspire is how new .NET distributed apps are built and run locally, with OpenTelemetry, health checks and service discovery wired in. Version 13 made it polyglot and added deployment pipelines.", "concepts": ["AppHost, resources, references, ServiceDefaults", "Dashboard, OTel, integrations (Postgres, Redis, RabbitMQ, Service Bus)", "Aspire.Hosting.Testing, aspire do / deploy, dashboard MCP server"], "res": [["aspire.dev documentation", "https://aspire.dev"], ["Aspire on Microsoft Learn", "https://learn.microsoft.com/dotnet/aspire/"]], "you": "Model your gateway, REST API, RabbitMQ and Oracle/Postgres topology in one AppHost."}, {"id": "srcgen", "area": "Modern .NET & C#", "title": "Source generators", "pri": "Should", "hrs": 3, "why": "Source generators replace reflection in JSON, logging, regex and config binding, and they are what makes Native AOT possible. Seniors are expected to know when the framework generates code for them.", "concepts": ["Incremental generators (IIncrementalGenerator)", "JsonSerializerContext, [LoggerMessage], [GeneratedRegex]", "Configuration binding generator"], "res": [["Source generators overview", "https://learn.microsoft.com/dotnet/csharp/roslyn-sdk/source-generators-overview"]], "you": "Replace a hot-path logger call with [LoggerMessage] and measure."}, {"id": "aot", "area": "Modern .NET & C#", "title": "Native AOT and trimming", "pri": "Should", "hrs": 3, "why": "AOT gives fast startup and small memory, which matters for serverless, sidecars and CLIs. You need to know what breaks: reflection, dynamic code and some libraries.", "concepts": ["PublishAot, CreateSlimBuilder, request delegate generator", "Trimming warnings and annotations", "When AOT is worth it and when it is not"], "res": [["Native AOT deployment", "https://learn.microsoft.com/dotnet/core/deploying/native-aot/"], ["ASP.NET Core Native AOT", "https://learn.microsoft.com/aspnet/core/fundamentals/native-aot"]], "you": "Publish a small FIX-utility CLI as AOT and compare startup."}, {"id": "grpc", "area": "Modern .NET & C#", "title": "gRPC in depth", "pri": "Must", "hrs": 6, "why": "gRPC is the default for service-to-service and streaming in many fintechs. Your TCP gateway and real-time API experience maps directly to its streaming model.", "concepts": ["Unary, server, client and bidirectional streaming", "Deadlines, cancellation, interceptors, status codes", "JSON transcoding, gRPC-Web, HTTP/2 load-balancing caveats"], "res": [["gRPC on .NET", "https://learn.microsoft.com/aspnet/core/grpc/"], ["gRPC concepts", "https://grpc.io/docs/what-is-grpc/core-concepts/"]], "you": "Re-implement your Real-Time price stream as gRPC server streaming."}, {"id": "perf", "area": "Modern .NET & C#", "title": "Performance engineering", "pri": "Must", "hrs": 10, "why": "Low-latency trading is your niche, and allocation-free code is what separates senior .NET engineers. Back every claim with BenchmarkDotNet numbers.", "concepts": ["Span/Memory, stackalloc, string.Create, UTF-8 literals", "ArrayPool, ObjectPool, System.IO.Pipelines, Channels", "BenchmarkDotNet: MemoryDiagnoser, baselines, multi-runtime jobs"], "res": [["BenchmarkDotNet", "https://benchmarkdotnet.org/articles/overview.html"], ["System.IO.Pipelines", "https://learn.microsoft.com/dotnet/standard/io/pipelines"], ["Channels", "https://learn.microsoft.com/dotnet/core/extensions/channels"]], "you": "Your market-data pipeline and FIX parsing are the natural benchmark targets."}, {"id": "filebased", "area": "Modern .NET & C#", "title": "File-based apps and runtime async", "pri": "Nice", "hrs": 2, "why": "`dotnet run app.cs` makes C# usable for scripts and quick tools. Runtime async in .NET 11 moves async handling into the runtime for lower overhead and cleaner stack traces.", "concepts": ["#:package and #:sdk directives, converting to a project", "Runtime async on net11.0 (release candidate)"], "res": [["File-based apps", "https://learn.microsoft.com/dotnet/core/sdk/file-based-apps"], ["What's new in .NET 11", "https://learn.microsoft.com/dotnet/core/whats-new/dotnet-11/overview"]], "you": "Rewrite one ops script (log scan, release check) as a file-based app."}, {"id": "licenses", "area": "Modern .NET & C#", "title": "OSS license changes in your stack", "pri": "Must", "hrs": 1, "why": "MediatR, AutoMapper, MassTransit v9 and FluentAssertions 8 now need commercial licenses for most companies. A senior is expected to flag this before an AI agent or a junior adds the package.", "concepts": ["Last free versions: MediatR 12.5, AutoMapper 14, MassTransit v8, FluentAssertions 7", "Alternatives: hand-rolled mediator, Wolverine, Brighter, Shouldly/AwesomeAssertions", "NuGet audit and license checks in CI"], "res": [["MassTransit v9 announcement", "https://masstransit.io/introduction/v9-announcement"]], "you": "Your current stack uses three of these, so prepare a one-minute answer."}, {"id": "k8s", "area": "Cloud, Deployment & DevOps", "title": "Kubernetes for .NET apps", "pri": "Must", "hrs": 14, "why": "Most senior backend postings list Kubernetes, and it is your biggest DevOps gap after Docker. You need to deploy, debug and scale a .NET service on it.", "concepts": ["Pods, Deployments, Services, namespaces, Gateway API / Ingress", "ConfigMaps, Secrets, probes mapped to health checks, graceful shutdown", "Requests/limits, HPA, KEDA, AKS workload identity"], "res": [["Kubernetes documentation", "https://kubernetes.io/docs/home/"], ["AKS documentation", "https://learn.microsoft.com/azure/aks/"], ["KEDA scalers", "https://keda.sh/docs/"]], "you": "KEDA scaling on RabbitMQ queue depth maps to your dealer queue."}, {"id": "helm", "area": "Cloud, Deployment & DevOps", "title": "Helm and Kustomize", "pri": "Should", "hrs": 4, "why": "Helm is how teams package and version Kubernetes deployments. You should read and write a chart with confidence.", "concepts": ["Charts, templates, values, releases, rollback", "Kustomize overlays vs Helm values"], "res": [["Helm docs", "https://helm.sh/docs/"]], "you": "Package your multi-tenant admin deployment as a chart with per-tenant values."}, {"id": "gha", "area": "Cloud, Deployment & DevOps", "title": "GitHub Actions (mapped from GitLab CI)", "pri": "Must", "hrs": 6, "why": "GitHub Actions is the most common CI in job postings. You already know the concepts from GitLab, so this is mostly a vocabulary map.", "concepts": ["Workflows, jobs, steps, runners, needs, matrix, cache, artifacts", "Environments with approvals, reusable workflows, composite actions", "OIDC federation to Azure/AWS, Dependabot, CodeQL"], "res": [["GitHub Actions docs", "https://docs.github.com/actions"], ["Migrating from GitLab CI/CD", "https://docs.github.com/actions/migrating-to-github-actions/manually-migrating-to-github-actions/migrating-from-gitlab-cicd-to-github-actions"]], "you": "Port your lint, typecheck, test, build, image, deploy pipeline one-to-one."}, {"id": "ado", "area": "Cloud, Deployment & DevOps", "title": "Azure DevOps Pipelines", "pri": "Should", "hrs": 3, "why": "Banks and enterprises in the region still run Azure DevOps. Knowing the YAML model and templates is enough for interviews.", "concepts": ["Stages, jobs, steps, templates, variable groups", "Service connections, environments and checks"], "res": [["Azure Pipelines docs", "https://learn.microsoft.com/azure/devops/pipelines/"]], "you": "Write the same pipeline as your GitHub Actions one for comparison."}, {"id": "bicep", "area": "Cloud, Deployment & DevOps", "title": "Bicep", "pri": "Should", "hrs": 4, "why": "Bicep is Azure's native IaC and the fastest way to deploy your capstone repeatably.", "concepts": ["Resources, params, modules, outputs", "what-if, deployment stacks"], "res": [["Bicep documentation", "https://learn.microsoft.com/azure/azure-resource-manager/bicep/"]], "you": "Replace manual portal setup with a reviewed, versioned template."}, {"id": "terraform", "area": "Cloud, Deployment & DevOps", "title": "Terraform", "pri": "Should", "hrs": 5, "why": "Terraform is the multi-cloud IaC standard and appears in many postings. Know state and modules well.", "concepts": ["Providers, resources, modules", "Remote state, locking, plan/apply, drift", "Bicep vs Terraform trade-offs"], "res": [["Terraform docs", "https://developer.hashicorp.com/terraform/docs"], ["AzureRM provider", "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs"]], "you": "Treat state locking like your row-level locking: one writer at a time."}, {"id": "azure", "area": "Cloud, Deployment & DevOps", "title": "Azure core services and AWS equivalents", "pri": "Must", "hrs": 8, "why": "You need a confident mental map of where each workload runs and what it costs. Interviewers often ask you to pick a service and justify it.", "concepts": ["App Service, Container Apps, AKS, Functions vs App Runner, ECS Fargate, EKS, Lambda", "Cosmos DB, Azure SQL, PostgreSQL Flexible vs DynamoDB, RDS/Aurora", "Key Vault vs Secrets Manager, Entra ID vs IAM"], "res": [["Azure Architecture Center", "https://learn.microsoft.com/azure/architecture/"], ["Azure for AWS professionals", "https://learn.microsoft.com/azure/architecture/aws-professional/"]], "you": "Map today's VertexFX deployment onto both clouds as an exercise."}, {"id": "servicebus", "area": "Cloud, Deployment & DevOps", "title": "Azure Service Bus, Event Hubs, Event Grid", "pri": "Must", "hrs": 3, "why": "These are the managed equivalents of your RabbitMQ and NATS work. Knowing sessions, dead-lettering and duplicate detection makes the comparison concrete.", "concepts": ["Queues, topics, subscriptions, sessions (FIFO per key)", "Dead-letter, duplicate detection, scheduled messages", "Event Hubs (stream) vs Event Grid (events) vs Service Bus (commands)"], "res": [["Service Bus docs", "https://learn.microsoft.com/azure/service-bus-messaging/"], ["Compare messaging services", "https://learn.microsoft.com/azure/service-bus-messaging/compare-messaging-services"]], "you": "Service Bus sessions solve per-account ordering, like your per-symbol ordering."}, {"id": "functions", "area": "Cloud, Deployment & DevOps", "title": "Azure Functions (isolated) and Durable Functions", "pri": "Should", "hrs": 6, "why": "The in-process model loses support on Nov 10, 2026, so migrations to isolated worker are active work. Durable Functions is a strong fit for settlement and approval workflows.", "concepts": ["Isolated worker: DI, middleware, triggers/bindings", "Flex Consumption plan", "Durable patterns: chaining, fan-out/in, human interaction, monitor"], "res": [["Isolated worker guide", "https://learn.microsoft.com/azure/azure-functions/dotnet-isolated-process-guide"], ["Durable Functions", "https://learn.microsoft.com/azure/azure-functions/durable/"]], "you": "Compare Durable orchestrations to your Hangfire jobs."}, {"id": "lambda", "area": "Cloud, Deployment & DevOps", "title": "AWS Lambda with .NET", "pri": "Nice", "hrs": 4, "why": "Needed only for AWS-first employers, but cold starts and when serverless fits are common interview questions.", "concepts": ["Handlers, Lambda Annotations, ASP.NET Core on Lambda", "Cold starts: SnapStart, Native AOT, memory sizing", "SQS triggers, API Gateway"], "res": [["Lambda with C#", "https://docs.aws.amazon.com/lambda/latest/dg/lambda-csharp.html"]], "you": "Your hands-on Lambda experiments give you a head start."}, {"id": "cloudsec", "area": "Cloud, Deployment & DevOps", "title": "Cloud identity, security and cost", "pri": "Must", "hrs": 6, "why": "Secretless deployments with managed identity are the expected standard now. Cost awareness is a senior signal interviewers probe for.", "concepts": ["Entra ID app registrations, managed identities, DefaultAzureCredential", "Key Vault, private endpoints, VNet integration", "Budgets, scale-to-zero, reservations, Well-Architected pillars"], "res": [["Managed identities", "https://learn.microsoft.com/entra/identity/managed-identities-azure-resources/overview"], ["Azure Well-Architected Framework", "https://learn.microsoft.com/azure/well-architected/"]], "you": "Connects to your credentials-in-logs and FIX-logon security fixes."}, {"id": "llm", "area": "AI & LLMs", "title": "LLM fundamentals", "pri": "Must", "hrs": 3, "why": "Every AI conversation in an interview builds on tokens, context and embeddings. You use these daily in PharmaIQ, so this is about naming them precisely.", "concepts": ["Tokens, context window, sampling", "Embeddings and similarity", "Hallucination, grounding, structured outputs"], "res": [["Anthropic docs", "https://docs.claude.com"], [".NET AI docs", "https://learn.microsoft.com/dotnet/ai/"]], "you": "PharmaIQ's grounding checks are your best example."}, {"id": "meai", "area": "AI & LLMs", "title": "Microsoft.Extensions.AI", "pri": "Must", "hrs": 3, "why": "It is the common abstraction every .NET AI library now builds on, like ILogger for LLMs. It lets you swap providers and add caching and telemetry as middleware.", "concepts": ["IChatClient, IEmbeddingGenerator", "Middleware: function invocation, caching, OpenTelemetry", "Microsoft.Extensions.VectorData"], "res": [["Microsoft.Extensions.AI", "https://learn.microsoft.com/dotnet/ai/microsoft-extensions-ai"]], "you": "Think of it as MediatR pipeline behaviors for model calls."}, {"id": "llmapis", "area": "AI & LLMs", "title": "Calling Claude, OpenAI and Foundry from C#", "pri": "Must", "hrs": 5, "why": "You must ship features against real providers: streaming, tools, structured output, prompt caching and rate limits. Microsoft Foundry hosts many of these models for enterprise customers.", "concepts": ["Official Anthropic and OpenAI .NET SDKs", "Azure OpenAI / Foundry deployments, Foundry Tools", "Streaming, retries, rate limits, prompt caching"], "res": [["Claude API docs", "https://docs.claude.com"], ["Microsoft Foundry docs", "https://learn.microsoft.com/azure/ai-foundry/"]], "you": "Port PharmaIQ's buffered, grounded stream pattern to C#."}, {"id": "rag", "area": "AI & LLMs", "title": "RAG, vector databases and evaluation", "pri": "Must", "hrs": 12, "why": "RAG is the most requested AI skill for backend engineers, and it is mostly backend work: ingestion, indexing, retrieval and evaluation. Without evals you cannot claim it works.", "concepts": ["Chunking, embeddings, hybrid search, reranking, citations", "Azure AI Search, pgvector, Qdrant", "Groundedness and retrieval metrics, golden datasets"], "res": [["Azure AI Search", "https://learn.microsoft.com/azure/search/"], ["pgvector", "https://github.com/pgvector/pgvector"], ["Microsoft.Extensions.AI.Evaluation", "https://learn.microsoft.com/dotnet/ai/evaluation/libraries"]], "you": "Your TimescaleDB/Postgres experience makes pgvector a natural start."}, {"id": "mcp", "area": "AI & LLMs", "title": "Tool calling, MCP and A2A", "pri": "Must", "hrs": 8, "why": "Tools are how LLMs reach real systems, and MCP is now the standard way to expose them. A2A covers agent-to-agent calls across vendors.", "concepts": ["Tool schemas, AIFunctionFactory, read-only vs side-effecting tools", "MCP servers/clients, tools/resources/prompts, stdio vs streamable HTTP, OAuth", "A2A agent cards and tasks"], "res": [["Model Context Protocol", "https://modelcontextprotocol.io"], ["MCP C# SDK", "https://github.com/modelcontextprotocol/csharp-sdk"], ["A2A protocol", "https://github.com/a2aproject/A2A"]], "you": "An MCP server over your Backoffice API library is a strong portfolio piece."}, {"id": "maf", "area": "AI & LLMs", "title": "Microsoft Agent Framework", "pri": "Should", "hrs": 10, "why": "It is Microsoft's GA successor to Semantic Kernel and AutoGen (1.0 in April 2026). Expect to meet Semantic Kernel code in existing projects and to migrate it.", "concepts": ["Agents, threads, tools, middleware", "Graph workflows with checkpointing and human-in-the-loop", "Multi-agent patterns: sequential, concurrent, handoff, group chat", "Migration from Semantic Kernel"], "res": [["Agent Framework on GitHub", "https://github.com/microsoft/agent-framework"], ["Agent Framework docs", "https://learn.microsoft.com/agent-framework/"]], "you": "Workflows with checkpoints resemble your durable dealer queue."}, {"id": "llmops", "area": "AI & LLMs", "title": "LLM cost, latency, safety and observability", "pri": "Must", "hrs": 3, "why": "Production AI fails on cost and safety, not on demos. Seniors are asked how they keep spend, latency and prompt injection under control.", "concepts": ["Token budgets, caching, model routing", "Streaming, smaller models, parallel calls", "Prompt injection, PII redaction, content filters, OTel GenAI conventions"], "res": [["OpenTelemetry GenAI semantic conventions", "https://opentelemetry.io/docs/specs/semconv/gen-ai/"], ["OWASP Top 10 for LLM apps", "https://genai.owasp.org/llm-top-10/"]], "you": "Your Datadog pack and redacted logging carry over directly."}, {"id": "aifintech", "area": "AI & LLMs", "title": "AI in fintech", "pri": "Should", "hrs": 2, "why": "Regulated firms want AI but fear hallucinations and audit gaps. Showing you know realistic use cases and controls sets you apart.", "concepts": ["Use cases: support, KYC document extraction, alert triage, internal tools", "Model risk, explainability, audit trails, human approval", "Data residency and vendor terms"], "res": [["NIST AI Risk Management Framework", "https://www.nist.gov/itl/ai-risk-management-framework"]], "you": "Frame it with your fintech compliance and audit experience."}, {"id": "aidev", "area": "AI & LLMs", "title": "AI coding assistants and agents", "pri": "Should", "hrs": 4, "why": "You already work AI-native, which is rare. Turn it into a repeatable, explainable process with guardrails.", "concepts": ["Spec → plan → implement with tests → review", "Repo instruction files, review subagents", "Supply-chain risk from AI-suggested packages"], "res": [["Claude Code docs", "https://docs.claude.com/en/docs/claude-code/overview"], ["GitHub Copilot docs", "https://docs.github.com/copilot"]], "you": "PharmaIQ in two weeks with ~220 tests is the proof point."}, {"id": "sysdesign", "area": "System Design & Career", "title": "System design: fintech scenarios", "pri": "Must", "hrs": 14, "why": "Senior interviews almost always include a design round. Trading scenarios let you lead with deep, real experience.", "concepts": ["Framework: requirements, estimates, API, data, design, deep dives, trade-offs", "Order matching, payments ledger, market-data fan-out, event processing", "Consistency, idempotency, ordering, back-pressure"], "res": [["Azure Architecture Center patterns", "https://learn.microsoft.com/azure/architecture/patterns/"], ["Designing Data-Intensive Applications (book)", "https://dataintensive.net/"]], "you": "Your order-routing engine is a ready-made deep dive."}, {"id": "portfolio", "area": "System Design & Career", "title": "Portfolio and capstone", "pri": "Must", "hrs": 22, "why": "Public, working code proves the new skills, since your VertexFX work is private. One strong capstone beats five toy repos.", "concepts": ["Clear README, architecture diagram, ADRs", "CI badge, live demo, short video", "Blog post per mini project"], "res": [["GitHub profile README", "https://docs.github.com/account-and-profile/setting-up-and-managing-your-github-profile/customizing-your-profile/managing-your-profile-readme"]], "you": "Reuse your ADR habit (34 decisions) in the capstone repo."}, {"id": "certs", "area": "System Design & Career", "title": "Certifications in 2026", "pri": "Nice", "hrs": 2, "why": "Certifications matter more for enterprise, consultancy and Gulf employers than for product companies. Pick at most one or two that close real gaps.", "concepts": ["AI-200 (replaced AZ-204)", "CKAD (hands-on Kubernetes)", "AI-103, AZ-400, AWS Developer Associate"], "res": [["Microsoft Credentials", "https://learn.microsoft.com/credentials/"], ["CKAD", "https://training.linuxfoundation.org/certification/certified-kubernetes-application-developer-ckad/"]], "you": "Book the exam during week 12 so the study plan has a finish line."}], "found": [{"sec": "C# fast points", "group": "Types and memory", "note": "Short answers interviewers expect in one or two sentences.", "items": [{"id": "fdc511f68", "text": "Value types (struct, int, enum) hold data directly, usually on the stack or inline; reference types (class, string, array) live on the heap and are accessed by reference."}, {"id": "f72ca58cf", "text": "Boxing = wrapping a value type in an object (heap allocation); unboxing = casting back. Avoid in hot paths."}, {"id": "f0ff0226d", "text": "`string` is immutable; use `StringBuilder` for many concatenations."}, {"id": "f07e66077", "text": "`record` = reference type with value-based equality and `with` expressions; `record struct` = value-type version."}, {"id": "fcb9242f8", "text": "`struct` vs `class`: structs are copied on assignment, no inheritance, best when small and immutable."}, {"id": "fad79be15", "text": "Nullable reference types (`string?`) give compile-time null warnings; `??`, `?.` and `??=` operators."}, {"id": "ffd3488e6", "text": "`Span<T>` / `Memory<T>`: slice memory without allocating; `Span` is stack-only, `Memory` can live on the heap and cross `await`."}]}, {"sec": "C# fast points", "group": "OOP", "note": "Short answers interviewers expect in one or two sentences.", "items": [{"id": "fc00d2296", "text": "Four pillars: encapsulation, abstraction, inheritance, polymorphism."}, {"id": "fa4e8c6da", "text": "Abstract class (shared state and code, single inheritance) vs interface (contract, multiple implementation, can have default methods since C# 8)."}, {"id": "f950258bb", "text": "`virtual` / `override` (runtime polymorphism) vs `new` (hides the member, no polymorphism)."}, {"id": "f03c76cc8", "text": "`sealed` prevents inheritance; `static` class cannot be instantiated."}, {"id": "f1a298be3", "text": "Access modifiers: public, private, protected, internal, protected internal, private protected."}, {"id": "fb76531bb", "text": "Method overloading (compile time) vs overriding (runtime)."}]}, {"sec": "C# fast points", "group": "Keywords and features", "note": "Short answers interviewers expect in one or two sentences.", "items": [{"id": "f900d7955", "text": "`const` (compile-time, implicitly static) vs `readonly` (set once in constructor, runtime)."}, {"id": "f0486a61b", "text": "`ref` (must be initialized), `out` (must be assigned inside the method), `in` (read-only by reference)."}, {"id": "fc379416b", "text": "`==` vs `Equals()`: reference vs value equality for classes unless overridden; override `GetHashCode` with `Equals`."}, {"id": "fca4a1b06", "text": "`is` / `as` / pattern matching (`switch` expressions, property and type patterns)."}, {"id": "fe64ef1f2", "text": "Generics and constraints (`where T : class, new()`); covariance (`out T`) and contravariance (`in T`)."}, {"id": "f9ed41bed", "text": "Extension methods: static methods in a static class with `this` on the first parameter; C# 14 extension blocks add extension properties and static members."}, {"id": "f79f3063c", "text": "Delegates, `Func<>`, `Action<>`, `Predicate<>`; events are delegates with restricted access."}, {"id": "ffb694037", "text": "Lambdas and closures; the captured-variable-in-loop trap."}, {"id": "f0d09d0af", "text": "`IEnumerable` (in-memory, LINQ to Objects) vs `IQueryable` (expression tree translated to SQL)."}, {"id": "f3fca6f17", "text": "LINQ deferred execution: the query runs on enumeration; `ToList()` materializes it. Watch for multiple enumeration."}, {"id": "fcb379770", "text": "`yield return` builds a lazy iterator."}, {"id": "fc9135808", "text": "`using` statement / declaration calls `Dispose()`; `IAsyncDisposable` with `await using`."}, {"id": "f0f66c44a", "text": "Exceptions: catch specific types, `throw;` keeps the stack trace (`throw ex;` resets it), `finally` always runs, exception filters with `when`."}]}, {"sec": "C# fast points", "group": "Async and threads", "note": "Short answers interviewers expect in one or two sentences.", "items": [{"id": "fbc2af658", "text": "`async`/`await` frees the thread while waiting on I/O; it does not create a new thread."}, {"id": "f42eb7cef", "text": "`Task` vs `ValueTask` (avoids allocation when the result is often synchronous; await only once)."}, {"id": "f5bd6339e", "text": "Never `.Result` or `.Wait()` on async code: deadlocks and thread-pool starvation."}, {"id": "f84dd41f2", "text": "`async void` only for event handlers; exceptions in it crash the process."}, {"id": "f87ec6a17", "text": "`CancellationToken` passed through every async call."}, {"id": "f24268fd2", "text": "`Task.WhenAll` for parallel I/O; `Parallel.ForEach` / `Parallel.ForEachAsync` for CPU or bounded concurrency."}, {"id": "f1a3aa788", "text": "Thread safety: `lock` (on a `System.Threading.Lock` since .NET 9), `SemaphoreSlim` (works with async), `Interlocked`, `ConcurrentDictionary`."}, {"id": "f52124c83", "text": "Race condition vs deadlock, and how you found and fixed yours."}]}, {"sec": "C# fast points", "group": "Collections", "note": "Short answers interviewers expect in one or two sentences.", "items": [{"id": "fcfe1e93e", "text": "`List<T>` O(1) index; `Dictionary<K,V>` and `HashSet<T>` O(1) lookup; `Queue`, `Stack`, `LinkedList`."}, {"id": "f4ad7fc7b", "text": "`IEnumerable` < `ICollection` < `IList` hierarchy; return the least specific type that works."}, {"id": "f88f5adbc", "text": "Immutable and frozen collections (`FrozenDictionary`, .NET 8+, with `AlternateLookup` for span keys since .NET 9) for read-heavy data like your hierarchy cache."}]}, {"sec": ".NET and ASP.NET Core fast points", "group": "Runtime", "note": "", "items": [{"id": "f24d03e39", "text": ".NET Framework (Windows only, legacy, 4.8.1 is the last) vs .NET 5+ (cross-platform, open source; even numbers are LTS: .NET 10 is current, supported to Nov 2028; .NET 8 and 9 end Nov 10, 2026)."}, {"id": "ff4adc2b4", "text": "CLR runs IL code; JIT compiles IL to machine code at runtime; AOT compiles ahead of time."}, {"id": "f29b4d90b", "text": "Managed vs unmanaged code; `IDisposable` and the dispose pattern for unmanaged resources."}, {"id": "fcf2bd092", "text": "GC: generations 0, 1, 2 plus the Large Object Heap (objects over 85 KB); objects that survive move up a generation."}, {"id": "fff5d8e4d", "text": "Common leaks: static collections that grow, event handlers never unsubscribed, undisposed connections (your Oracle pool leak)."}, {"id": "f851d5a27", "text": "Kestrel is the built-in web server; in production it sits behind nginx, IIS or a load balancer."}]}, {"sec": ".NET and ASP.NET Core fast points", "group": "Startup and dependency injection", "note": "", "items": [{"id": "fc65afdf5", "text": "`Program.cs` with `WebApplication.CreateBuilder`: register services, build, configure the middleware pipeline, run."}, {"id": "f7e29eff2", "text": "Lifetimes: Singleton (one per app), Scoped (one per HTTP request), Transient (new every time)."}, {"id": "fd31df89a", "text": "Captive dependency: a singleton holding a scoped service (e.g., DbContext) causes stale or shared state; use `IServiceScopeFactory`."}, {"id": "f054d66dc", "text": "Constructor injection is preferred (primary constructors make it shorter since C# 12); keyed services exist since .NET 8."}]}, {"sec": ".NET and ASP.NET Core fast points", "group": "Middleware and request pipeline", "note": "", "items": [{"id": "fa85b2d26", "text": "Middleware runs in registration order on the way in and reverse order on the way out."}, {"id": "f144fb9ba", "text": "Typical order: exception handler, HTTPS redirect, static files, routing, CORS, authentication, authorization, rate limiting, endpoints."}, {"id": "f06c2871a", "text": "`Use` (calls next), `Run` (terminal), `Map` (branches by path)."}, {"id": "fc6147fbe", "text": "Filters (MVC only): authorization, resource, action, exception, result. Middleware sees every request; filters see controller actions."}, {"id": "f149362cd", "text": "Global error handling with `IExceptionHandler` (.NET 8+) and ProblemDetails responses."}]}, {"sec": ".NET and ASP.NET Core fast points", "group": "Controllers and APIs", "note": "", "items": [{"id": "fdffa4a67", "text": "Controllers (`[ApiController]`, attribute routing, automatic 400 on invalid model) vs Minimal APIs (lighter, endpoint groups)."}, {"id": "fb28a3b95", "text": "Model binding sources: `[FromBody]`, `[FromQuery]`, `[FromRoute]`, `[FromHeader]`."}, {"id": "f5a2f5cda", "text": "Validation: data annotations, built-in minimal API validation (`AddValidation()`, .NET 10), or FluentValidation (often as a MediatR pipeline behavior)."}, {"id": "f7bfc84bd", "text": "`IActionResult` vs `ActionResult<T>` vs typed results."}, {"id": "fe7562615", "text": "API versioning (URL, header or query), built-in OpenAPI (`Microsoft.AspNetCore.OpenApi`; Swashbuckle is no longer in the templates), output caching, HybridCache for data."}, {"id": "fc0a41cba", "text": "Built-in rate limiting middleware (fixed window, sliding window, token bucket, concurrency)."}]}, {"sec": ".NET and ASP.NET Core fast points", "group": "Configuration and hosting", "note": "", "items": [{"id": "fc36f7afd", "text": "Configuration sources in order: appsettings.json, appsettings.{Environment}.json, user secrets, environment variables, command line; the last one wins."}, {"id": "f25bcfc7b", "text": "Options pattern: `IOptions<T>` (singleton snapshot), `IOptionsSnapshot<T>` (per request), `IOptionsMonitor<T>` (live reload)."}, {"id": "f66e14bea", "text": "Environments: Development, Staging, Production via `ASPNETCORE_ENVIRONMENT`."}, {"id": "f3e6ec7ed", "text": "`BackgroundService` / `IHostedService` for long-running work; Hangfire for scheduled and persistent jobs."}, {"id": "f88eed7e0", "text": "Health checks (`/health`) for load balancers and orchestrators."}]}, {"sec": ".NET and ASP.NET Core fast points", "group": "HTTP and resilience", "note": "", "items": [{"id": "fda4824de", "text": "`IHttpClientFactory`: avoids socket exhaustion from `new HttpClient()` per call and stale DNS from one static client."}, {"id": "fcec5c71e", "text": "Typed and named clients; Polly or Microsoft.Extensions.Http.Resilience for retry, timeout, circuit breaker."}]}, {"sec": ".NET and ASP.NET Core fast points", "group": "Data access", "note": "", "items": [{"id": "f3af039b0", "text": "EF Core: DbContext is scoped and not thread-safe; change tracking; `AsNoTracking()` for reads; migrations."}, {"id": "f513ffd1b", "text": "N+1 problem and the fix: `Include`, projections with `Select`, or a single query."}, {"id": "fad32ad3d", "text": "Lazy vs eager vs explicit loading."}, {"id": "f46a6bc7f", "text": "Dapper: micro-ORM, raw SQL with parameters, fast; good for Oracle stored procedures and reporting queries."}, {"id": "fbcefbf23", "text": "Transactions: `BeginTransaction`, `TransactionScope`, and keeping them short."}, {"id": "f01545922", "text": "Optimistic concurrency with a row version vs pessimistic locking (`SELECT ... FOR UPDATE`)."}]}, {"sec": ".NET and ASP.NET Core fast points", "group": "Security in ASP.NET Core", "note": "", "items": [{"id": "f53844e16", "text": "Authentication (who you are) vs authorization (what you can do)."}, {"id": "f20acc169", "text": "`AddAuthentication().AddJwtBearer()`, `[Authorize]`, policy-based and role-based authorization, claims."}, {"id": "f0ca4abe8", "text": "Data Protection API, HTTPS and HSTS, CORS policies, anti-forgery for cookie-based apps."}, {"id": "ffd5ae99c", "text": "Secrets never in source control: environment variables, user secrets, a vault."}]}, {"sec": ".NET and ASP.NET Core fast points", "group": "Logging and diagnostics", "note": "", "items": [{"id": "fd309d0b6", "text": "`ILogger<T>` with structured logging (Serilog), log levels, correlation IDs."}, {"id": "f0f83057a", "text": "OpenTelemetry for traces and metrics; tools: dotnet-counters, dotnet-trace, dotnet-dump."}]}, {"sec": "Priority 1: close the gaps", "group": "Authentication and authorization", "note": "These are in the posting but not clearly on your CV, so expect probing here.", "items": [{"id": "f53146247", "text": "OAuth2 roles: client, resource owner, authorization server, resource server."}, {"id": "ff7a89df5", "text": "OAuth2 flows: authorization code + PKCE (users, SPAs, mobile), client credentials (service to service), refresh tokens. Why implicit and password flows are deprecated."}, {"id": "fa25067df", "text": "OpenID Connect = identity layer on OAuth2; ID token (who the user is) vs access token (what the client can call)."}, {"id": "fadae693f", "text": "Scopes vs claims vs roles."}, {"id": "fb3aa417f", "text": "JWT: header.payload.signature, HS256 (shared secret) vs RS256 (public/private key), validating issuer, audience, expiry, signature; short-lived access tokens plus refresh tokens; revocation options."}, {"id": "fbbf4bb18", "text": "SAML 2.0: XML-based SSO common in enterprises and banks; Identity Provider vs Service Provider; signed assertions; SP-initiated vs IdP-initiated login."}, {"id": "f781742af", "text": "Identity providers you can name: Keycloak, Duende IdentityServer, Microsoft Entra ID (Azure AD), ADFS."}]}, {"sec": "Priority 1: close the gaps", "group": "Deployment on Linux", "note": "These are in the posting but not clearly on your CV, so expect probing here.", "items": [{"id": "f52f068ef", "text": "Publish (`dotnet publish -c Release`), framework-dependent vs self-contained."}, {"id": "fb9dfb208", "text": "Run as a systemd service (unit file, restart policy, environment variables, `journalctl` for logs)."}, {"id": "ff4f88dfa", "text": "nginx as reverse proxy: forwarded headers middleware, TLS termination, load balancing."}, {"id": "f8b2d2faf", "text": "Docker: multi-stage Dockerfile or SDK container publish (`dotnet publish /t:PublishContainer`), chiseled images, non-root user, health checks; you already do this."}, {"id": "fc21b71f1", "text": "Basic commands: permissions (`chmod`, `chown`), ports (`ss -tlnp`), processes (`top`, `ps`), disk (`df`)."}]}, {"sec": "Priority 1: close the gaps", "group": "Deployment on Windows", "note": "These are in the posting but not clearly on your CV, so expect probing here.", "items": [{"id": "fdf7e66f2", "text": "IIS hosting: ASP.NET Core Hosting Bundle, ASP.NET Core Module, in-process vs out-of-process."}, {"id": "f532aa16f", "text": "Application pools (No Managed Code for .NET Core), identity, recycling, `web.config`."}, {"id": "f1a8b5822", "text": "Running as a Windows Service (`UseWindowsService`)."}, {"id": "ff171ab52", "text": "Where WCF and the legacy services you maintained were hosted; mention it, it is real Windows experience."}]}, {"sec": "Priority 1: close the gaps", "group": "Legacy .NET technologies", "note": "These are in the posting but not clearly on your CV, so expect probing here.", "items": [{"id": "f1954474e", "text": "SOAP: XML envelope, WSDL contract, WS-Security; vs REST."}, {"id": "f37aa277d", "text": "WCF: ABC (Address, Binding, Contract), `ServiceContract`, `OperationContract`, `DataContract`, bindings (basicHttp, wsHttp, netTcp). You maintained ~390 operations, so own this."}, {"id": "f147a7cff", "text": "CoreWCF: lets WCF services run on modern .NET during migration."}, {"id": "f9ca5e557", "text": "Web Forms: page lifecycle (Init, Load, PreRender, Render), ViewState, postbacks, server controls, code-behind."}, {"id": "fb3cbd274", "text": "ASP.NET MVC 5 (System.Web, Global.asax, Web.config) vs ASP.NET Core MVC (middleware, DI built in, cross-platform)."}]}, {"sec": "Priority 1: close the gaps", "group": "Migration strategy", "note": "These are in the posting but not clearly on your CV, so expect probing here.", "items": [{"id": "f9ffc45ef", "text": "Strangler fig pattern: put a facade or gateway in front, move features one by one, retire the old system."}, {"id": "fb77957bf", "text": "Running old and new side by side; your Off/Shadow/Active modes are exactly this. Prepare the full story."}, {"id": "fe466a930", "text": "Migrating a SOAP service to REST: keep the contract working for existing clients, add a REST layer, compare outputs, switch traffic gradually."}, {"id": "fb6a2a202", "text": ".NET Framework to .NET 10 LTS path: GitHub Copilot app modernization agent (.NET Upgrade Assistant is deprecated), System.Web adapters + YARP for incremental moves, replace System.Web dependencies, move config to appsettings, check third-party library support."}, {"id": "fb3fb06bf", "text": "Risks: hidden business rules in old code, data differences, rollback plan."}]}, {"sec": "Design principles and patterns", "group": "SOLID", "note": "Have one example from your own code for each SOLID letter.", "items": [{"id": "f58697460", "text": "S, Single Responsibility: one reason to change (e.g., one MediatR handler per command)."}, {"id": "f019df0ca", "text": "O, Open/Closed: extend without modifying (e.g., adding a new liquidity-provider connector behind an interface)."}, {"id": "fab825341", "text": "L, Liskov Substitution: subtypes must work wherever the base type is used, without surprises."}, {"id": "f066295c1", "text": "I, Interface Segregation: small focused interfaces instead of one fat interface."}, {"id": "f7f06545e", "text": "D, Dependency Inversion: depend on abstractions; DI container provides implementations."}]}, {"sec": "Design principles and patterns", "group": "Other principles", "note": "Have one example from your own code for each SOLID letter.", "items": [{"id": "fed8279a8", "text": "DRY (but avoid wrong abstractions), KISS, YAGNI, separation of concerns, composition over inheritance, fail fast."}]}, {"sec": "Design principles and patterns", "group": "Patterns to explain with examples", "note": "Have one example from your own code for each SOLID letter.", "items": [{"id": "f8e803b9f", "text": "Repository and Unit of Work; the debate: EF Core DbContext already is one, so a generic repository can add little; a specific repository still helps with Oracle and Dapper."}, {"id": "fd2131490", "text": "Dependency injection and inversion of control."}, {"id": "f2d632c27", "text": "Strategy (your routing-rules engine), Factory, Builder, Decorator (logging or caching around a service), Adapter (wrapping legacy or third-party APIs), Facade."}, {"id": "fb18c26aa", "text": "Mediator / CQRS with MediatR (commercial license after v12.5; know a hand-rolled or Wolverine alternative), pipeline behaviors for validation and logging."}, {"id": "f128f018c", "text": "Observer / publish-subscribe (events, RabbitMQ)."}, {"id": "f14a13ed1", "text": "Singleton and why the DI singleton lifetime is preferred over a static singleton."}, {"id": "f12485ef6", "text": "Options pattern, Result pattern vs exceptions for expected failures."}]}, {"sec": "Design principles and patterns", "group": "Architecture styles", "note": "Have one example from your own code for each SOLID letter.", "items": [{"id": "fccdab902", "text": "Clean / Onion architecture: Domain, Application, Infrastructure, API; dependencies point inward."}, {"id": "f08e611d3", "text": "Layered (N-tier) vs vertical slice."}, {"id": "f69e8dc0e", "text": "Monolith vs modular monolith vs microservices, and when each fits."}]}, {"sec": "API design and security", "group": "", "note": "", "items": [{"id": "f270b5304", "text": "REST constraints: client-server, stateless, cacheable, uniform interface, resource-based URLs (nouns, plural, nested only one level)."}, {"id": "f665d61b1", "text": "HTTP methods: GET, POST, PUT (full replace, idempotent), PATCH (partial), DELETE (idempotent)."}, {"id": "f0a4ba11c", "text": "Status codes: 200, 201 (with Location), 204, 400, 401 vs 403, 404, 409 (conflict), 422, 429, 500, 503."}, {"id": "f8824f9ae", "text": "Idempotency keys for POST in payments and trading (prevents duplicate orders; ties to your duplicate-positions story)."}, {"id": "fd854a735", "text": "Pagination (offset vs cursor/keyset, and why keyset is faster on large Oracle tables), filtering, sorting."}, {"id": "f19915ed7", "text": "Versioning strategies and backward compatibility."}, {"id": "fdd3e7e21", "text": "Consistent error format with ProblemDetails (RFC 7807 / 9457)."}, {"id": "f3e634af3", "text": "OpenAPI as a contract; your typed client mirroring the OpenAPI spec."}, {"id": "fead84a12", "text": "REST vs SOAP vs gRPC vs WebSockets / SignalR: when to use each."}, {"id": "f73755e9f", "text": "OWASP API Top 10: broken object-level authorization, broken authentication, excessive data exposure, missing rate limiting, injection, security misconfiguration."}, {"id": "fa65b3bff", "text": "Input validation, parameterized queries (your SQL-injection fix), output encoding."}, {"id": "fc227e663", "text": "HTTPS everywhere, HSTS, CORS done right, secrets management, no sensitive data in logs or URLs (your credentials-in-logs fix)."}, {"id": "f7e2bf2bf", "text": "API documentation: what a good API doc contains (endpoints, auth, examples, errors, rate limits)."}]}, {"sec": "Oracle deep dive", "group": "Performance", "note": "The posting says \"mainly Oracle\", so this is the most likely technical deep dive.", "items": [{"id": "fe3914fa1", "text": "Reading an execution plan (`EXPLAIN PLAN`, `DBMS_XPLAN.DISPLAY_CURSOR`): full table scan, index range scan, index unique scan, nested loops vs hash join, cost and cardinality."}, {"id": "f33213081", "text": "Index types: B-tree, composite (column order matters), function-based, bitmap (low cardinality, not for heavy OLTP writes), unique."}, {"id": "f17b573be", "text": "Why an index is not used: function on the column, implicit type conversion, leading wildcard `LIKE '%x'`, `OR` conditions, stale statistics."}, {"id": "fa76e1c0d", "text": "Statistics (`DBMS_STATS`), optimizer hints (use sparingly)."}, {"id": "fbb21244b", "text": "Bind variables: reuse execution plans (avoid hard parsing) and prevent SQL injection."}, {"id": "fb233521c", "text": "AWR reports and finding the top SQL; tracing slow queries."}, {"id": "f3d1ddbb0", "text": "Partitioning (range, list, hash) for large tables such as trades or ticks."}, {"id": "fb9d8b2e0", "text": "Bulk operations: `BULK COLLECT`, `FORALL`, array binding in ODP.NET."}]}, {"sec": "Oracle deep dive", "group": "PL/SQL", "note": "The posting says \"mainly Oracle\", so this is the most likely technical deep dive.", "items": [{"id": "f24106b50", "text": "Procedures vs functions vs packages (spec and body, why packages are preferred)."}, {"id": "f20d114ab", "text": "Cursors: implicit, explicit, `REF CURSOR` returned to .NET."}, {"id": "f475ad1dc", "text": "Exception handling (`WHEN OTHERS`, `RAISE_APPLICATION_ERROR`), autonomous transactions (for audit logging)."}, {"id": "f9e5c2551", "text": "Triggers: when to use and why to avoid business logic in them."}, {"id": "fae845e4f", "text": "Sequences and identity columns; `MERGE` for upserts."}, {"id": "f1925eb77", "text": "Views vs materialized views."}]}, {"sec": "Oracle deep dive", "group": "Transactions and concurrency", "note": "The posting says \"mainly Oracle\", so this is the most likely technical deep dive.", "items": [{"id": "f5f3514cd", "text": "ACID; Oracle defaults to READ COMMITTED; SERIALIZABLE; readers never block writers (multi-version read consistency, undo)."}, {"id": "f91de953a", "text": "Row-level locking, `SELECT ... FOR UPDATE [NOWAIT | SKIP LOCKED]`; your duplicate-positions fix in detail."}, {"id": "fb6735109", "text": "Deadlocks (ORA-00060): cause and prevention (consistent lock order, short transactions)."}, {"id": "f01cb9c6f", "text": "Optimistic concurrency with a version column vs pessimistic locking."}, {"id": "fa0a232e8", "text": "COMMIT / ROLLBACK / SAVEPOINT."}]}, {"sec": "Oracle deep dive", "group": ".NET to Oracle", "note": "The posting says \"mainly Oracle\", so this is the most likely technical deep dive.", "items": [{"id": "f9233498f", "text": "ODP.NET Managed Driver (`Oracle.ManagedDataAccess.Core`), EF Core Oracle provider, Dapper with Oracle parameters."}, {"id": "f8d75f2d8", "text": "Connection pooling settings (Min/Max Pool Size, Connection Lifetime) and how you found and fixed the pool leak."}, {"id": "f6f9b6a30", "text": "Calling stored procedures and reading REF CURSORs from C#."}]}, {"sec": "Oracle deep dive", "group": "Data modeling", "note": "The posting says \"mainly Oracle\", so this is the most likely technical deep dive.", "items": [{"id": "fb95d0717", "text": "Normalization (1NF, 2NF, 3NF) and when to denormalize for reads."}, {"id": "f7b6665af", "text": "Primary keys, foreign keys, constraints, indexes on foreign keys."}, {"id": "f76992c2e", "text": "Schema migrations across environments (you owned these for QA, Beta, production)."}, {"id": "ff697a5f7", "text": "SQL basics they may test live: joins (inner, left, full), `GROUP BY` + `HAVING`, window functions (`ROW_NUMBER`, `RANK`, `LAG`), subqueries vs CTEs, finding duplicates, Nth highest value."}]}, {"sec": "Integration, messaging and microservices", "group": "Messaging", "note": "", "items": [{"id": "f4e161453", "text": "RabbitMQ: producer, exchange (direct, topic, fanout, headers), binding, queue, consumer; acks and prefetch."}, {"id": "f60c14a20", "text": "MassTransit: consumers, retry and redelivery policies, error and dead-letter queues, sagas (state machines); v9 is commercial, v8 is open source with patches through 2026."}, {"id": "f61b96498", "text": "Delivery guarantees: at-most-once, at-least-once, exactly-once (really idempotent processing)."}, {"id": "fea801deb", "text": "Idempotent consumers (dedupe by message ID)."}, {"id": "f771f40b3", "text": "Transactional outbox: save the event in the same DB transaction as the data, publish afterwards."}, {"id": "f472e9825", "text": "Message ordering, poison messages, back-pressure."}, {"id": "f0ef76c76", "text": "Queue (point-to-point) vs topic (publish-subscribe); commands vs events."}, {"id": "fc1c7c5e0", "text": "Others to name: Azure Service Bus, Kafka (log-based, replay), NATS JetStream (on your CV)."}]}, {"sec": "Integration, messaging and microservices", "group": "Integration", "note": "", "items": [{"id": "f3b8001b9", "text": "Synchronous (REST, SOAP, gRPC) vs asynchronous (messages) integration and the trade-offs."}, {"id": "f5a31931c", "text": "API gateway role: routing, auth, rate limiting, aggregation; YARP, Ocelot, Azure API Management, Kong."}, {"id": "f7a388bec", "text": "Enterprise Service Bus concept vs lightweight message brokers."}, {"id": "f9b88c83a", "text": "Integrating third-party APIs safely: timeouts, retries with backoff, circuit breakers, webhooks with signature verification."}, {"id": "f84ed6a4f", "text": "FIX protocol basics (session vs application messages, logon, heartbeat, sequence numbers) for your story."}, {"id": "ff1b6217a", "text": "File-based and batch integrations (SFTP, CSV) still common in banks."}]}, {"sec": "Integration, messaging and microservices", "group": "Microservices", "note": "", "items": [{"id": "f26f9943f", "text": "Service boundaries by business capability; database per service."}, {"id": "fac6a152d", "text": "Distributed transactions: why 2PC is avoided; sagas (choreography vs orchestration) and compensation."}, {"id": "f30d1a01a", "text": "Eventual consistency and how to explain it to the business."}, {"id": "f7547b935", "text": "Resilience: timeouts, retries, circuit breaker, bulkhead, fallback."}, {"id": "f08f63170", "text": "Service discovery, configuration, centralized logging, distributed tracing with correlation IDs."}, {"id": "fe8722557", "text": "Caching: in-memory vs distributed (Redis), HybridCache (L1 + L2, stampede protection), invalidation, cache-aside; your hierarchy cache."}, {"id": "f873aee8d", "text": "When NOT to use microservices."}]}, {"sec": "Testing, CI/CD, observability and compliance", "group": "Testing", "note": "", "items": [{"id": "f5dc0456c", "text": "Test pyramid: many unit, fewer integration, few end-to-end."}, {"id": "f3f82a8cb", "text": "Unit tests: Arrange-Act-Assert, mocks vs stubs vs fakes (NSubstitute), what not to mock."}, {"id": "f4a747645", "text": "Integration tests: `WebApplicationFactory`, Testcontainers with a real database, testing against Oracle."}, {"id": "fd5277d23", "text": "TDD basics; code coverage and why 100% is not the goal."}, {"id": "f06abcd7d", "text": "Contract testing for APIs and testing message consumers."}]}, {"sec": "Testing, CI/CD, observability and compliance", "group": "CI/CD", "note": "", "items": [{"id": "fafd1d214", "text": "Your GitLab pipeline stages: lint, typecheck, test, build, container image, deploy."}, {"id": "fbac80b8f", "text": "Branching (GitFlow vs trunk-based), merge request reviews, quality gates."}, {"id": "f96951002", "text": "Deployment strategies: rolling, blue-green, canary, feature flags; rollback plan."}, {"id": "f86de7193", "text": "Database migrations in pipelines and backward-compatible schema changes."}]}, {"sec": "Testing, CI/CD, observability and compliance", "group": "Observability and performance", "note": "", "items": [{"id": "f0c619f8a", "text": "Three pillars: logs, metrics, traces; OpenTelemetry; your Datadog pack (76 monitors, 79 runbooks)."}, {"id": "fc7aac73b", "text": "What to alert on: error rate, latency percentiles (p95, p99), saturation, queue depth."}, {"id": "ffb2a61a5", "text": "Performance tuning process: measure first, find the bottleneck, fix, measure again."}, {"id": "ff1114883", "text": "Profiling: dotnet-counters (CPU, GC, thread pool), dotnet-trace, dotnet-dump, BenchmarkDotNet."}, {"id": "ffd8d7222", "text": "Common .NET bottlenecks: N+1 queries, sync-over-async, excessive allocations, chatty DB calls (your ~3,600 queries per event)."}]}, {"sec": "Testing, CI/CD, observability and compliance", "group": "Security and compliance (fintech)", "note": "", "items": [{"id": "fbc74d4b2", "text": "Encryption in transit (TLS) and at rest (Oracle TDE), hashing passwords (bcrypt, PBKDF2)."}, {"id": "fd5bf8c41", "text": "Secrets management (vault, environment variables), key rotation."}, {"id": "f0a44c1c7", "text": "Audit logging: who did what and when, immutable, separate from application logs."}, {"id": "fa6d81c5b", "text": "Masking and redacting personal and financial data (your redacted logging)."}, {"id": "f9b68f443", "text": "Least privilege for DB users and services."}, {"id": "faec64cf2", "text": "Standards to name: PCI-DSS (card data), GDPR principles, ISO 27001, local central bank regulations."}, {"id": "f491bd0f1", "text": "Incident handling: triage, communication, rollback, blameless postmortem."}]}, {"sec": "Modern C# (12 to 15)", "group": "", "note": "Anything marked release candidate ships with .NET 11 in November 2026; say so in interviews until then.", "items": [{"id": "f2b21f949", "text": "Primary constructors (C# 12): `class OrderService(IOrderRepo repo)`; parameters are captured, not readonly fields."}, {"id": "f4e3d8704", "text": "Collection expressions (C# 12): `int[] a = [1, 2, ..rest];` works for arrays, lists, spans and immutable collections."}, {"id": "f8035e9e9", "text": "C# 12 extras: alias any type (`using Price = decimal;`), default lambda parameters, `ref readonly` parameters, inline arrays."}, {"id": "ff3144dd1", "text": "C# 13: `params ReadOnlySpan<T>` and other params collections, `System.Threading.Lock`, partial properties, `\\e` escape, `allows ref struct`."}, {"id": "f942abd13", "text": "C# 14 extension members: `extension(IEnumerable<T> s) { public bool IsEmpty => !s.Any(); }` adds properties and static members."}, {"id": "f031a5e4d", "text": "C# 14 `field` keyword: `set => field = value ?? throw new ArgumentNullException();` with no manual backing field."}, {"id": "f7e133ed5", "text": "C# 14 null-conditional assignment: `order?.Status = Filled;` and `?.` with `+=`."}, {"id": "fc7e1847b", "text": "C# 14 extras: implicit span conversions, `nameof(List<>)`, lambda parameter modifiers, partial constructors and events, user-defined compound assignment."}, {"id": "f2b10efbf", "text": "C# 15 union types (release candidate until .NET 11 GA, Nov 2026): `union OrderResult(Accepted, Rejected);` with exhaustive `switch`."}, {"id": "f47f29b89", "text": "C# 15 closed hierarchies (release candidate): `closed` base class, subtypes only in the same assembly, exhaustive matching; unions combine existing types, closed hierarchies define one family."}, {"id": "f9a9a1e9a", "text": "C# 15 extras (release candidate): collection expression arguments (capacity, comparer), extension indexers, labeled `break`/`continue`."}, {"id": "f9cbea96b", "text": "Runtime async (.NET 11, release candidate): the runtime handles async methods; lower overhead and cleaner stack traces."}]}, {"sec": "Modern .NET 10 and ASP.NET Core 10", "group": "", "note": "", "items": [{"id": "f8feef903", "text": "Support policy: .NET 10 LTS until Nov 2028; .NET 8 and .NET 9 end Nov 10, 2026; .NET 11 is STS (24 months), GA Nov 2026."}, {"id": "fceaf0b90", "text": "Upgrade .NET 8 → 10: TFM and global.json, package updates, breaking-change review, tests, staged rollout; GitHub Copilot app modernization agent (Upgrade Assistant is deprecated)."}, {"id": "fc996ef29", "text": "Built-in OpenAPI document generation (OpenAPI 3.1); Scalar or Swagger UI are optional add-ons."}, {"id": "f2b9cacf8", "text": "Minimal APIs: route groups, endpoint filters, TypedResults, built-in validation with `AddValidation()`, Server-Sent Events."}, {"id": "f6b41e9c4", "text": "HybridCache: L1 memory + L2 distributed, stampede protection, tag invalidation; the d
