efault over hand-written cache-aside."}, {"id": "f12c8bf1e", "text": "Passkey support in ASP.NET Core Identity (.NET 10)."}, {"id": "f9931e5d6", "text": "File-based apps: `dotnet run app.cs` with `#:package` directives; convert to a project when it grows."}, {"id": "f63e8206e", "text": "Native AOT: `PublishAot`, `CreateSlimBuilder`, source-generated JSON, trimming warnings; best for fast startup and low memory."}, {"id": "fb48c6c25", "text": "Source generators: incremental generators; `[GeneratedRegex]`, `[LoggerMessage]`, JSON and config-binding generators."}, {"id": "f431999d0", "text": "Allocation-free code: Span, stackalloc, ArrayPool, ObjectPool, System.IO.Pipelines, Channels; prove it with BenchmarkDotNet."}, {"id": "fcbd4a208", "text": "gRPC: unary, server, client and bidirectional streaming; deadlines, interceptors, JSON transcoding; HTTP/2 needs client-side or L7 load balancing."}, {"id": "f78cb926d", "text": "License changes: MediatR and AutoMapper (commercial after 12.5 / 14), MassTransit v9 (commercial; v8 patched through 2026), FluentAssertions 8 (commercial); know the alternatives."}]}, {"sec": "Aspire, containers and Kubernetes", "group": "", "note": "", "items": [{"id": "fb5174441", "text": "Aspire (no longer \".NET Aspire\" since v13): AppHost, resources, references, ServiceDefaults (OTel, health, resilience, service discovery), dashboard."}, {"id": "f62eb7848", "text": "Aspire integrations and testing: Postgres, Redis, RabbitMQ, Service Bus; Aspire.Hosting.Testing; `aspire do` and deploy targets."}, {"id": "f2515aa26", "text": "Containers: SDK container publish without a Dockerfile, chiseled images, non-root user, image scanning."}, {"id": "f52871328", "text": "Kubernetes objects: Pod, Deployment, ReplicaSet, Service, namespace, ConfigMap, Secret, Gateway API / Ingress."}, {"id": "fe198886c", "text": "Probes: liveness, readiness, startup mapped to ASP.NET health checks; graceful shutdown on SIGTERM."}, {"id": "fdce06ed9", "text": "Requests and limits, and how CPU/memory limits affect the .NET GC and thread pool."}, {"id": "fe0a8eb14", "text": "Autoscaling: HPA on CPU/memory vs KEDA on queue length (RabbitMQ, Service Bus)."}, {"id": "f254deac8", "text": "Helm: charts, values, releases, rollback; Kustomize overlays."}, {"id": "fd9a26b5c", "text": "AKS basics: node pools, workload identity, ingress options."}]}, {"sec": "CI/CD and Infrastructure as Code", "group": "", "note": "", "items": [{"id": "f88e4c406", "text": "GitHub Actions vs GitLab CI: workflow = pipeline, job = job, step = script line, runner = runner; `needs`, matrix, cache, artifacts, environments."}, {"id": "ff70efb25", "text": "OIDC federated credentials from CI to Azure/AWS: no stored cloud secrets."}, {"id": "f9f601774", "text": "Azure DevOps Pipelines: stages, templates, variable groups, service connections, environment checks."}, {"id": "facc90b1b", "text": "Supply chain: Dependabot, CodeQL, secret scanning, SBOM, NuGet audit, central package management, license checks."}, {"id": "fc3ff8421", "text": "Bicep: resources, params, modules, outputs, `what-if`, deployment stacks."}, {"id": "fd3a957a5", "text": "Terraform: providers, remote state with locking, modules, plan/apply, drift; Bicep vs Terraform trade-offs."}, {"id": "fa2b0f292", "text": "Cloud deployment strategies: App Service slots, Container Apps revisions with traffic splitting, blue-green, canary."}]}, {"sec": "Cloud: Azure, AWS and serverless", "group": "", "note": "", "items": [{"id": "ff4b246a8", "text": "Compute map: App Service / Container Apps / AKS / Functions ↔ App Runner or Beanstalk / ECS Fargate / EKS / Lambda."}, {"id": "f00175a88", "text": "Messaging: Service Bus (queues, topics, sessions, dead-letter, duplicate detection) vs RabbitMQ; Event Hubs vs Event Grid; SQS/SNS, EventBridge, Kinesis."}, {"id": "f8c5bab05", "text": "Data: Cosmos DB partition keys, RUs, consistency levels; Azure SQL, PostgreSQL Flexible ↔ DynamoDB, RDS/Aurora."}, {"id": "fc1631804", "text": "Azure Functions isolated worker model (in-process support ends Nov 10, 2026); Flex Consumption plan."}, {"id": "f3a756fbe", "text": "Durable Functions patterns: chaining, fan-out/fan-in, human interaction, monitor."}, {"id": "f0ae0c144", "text": "AWS Lambda with .NET: Lambda Annotations, SnapStart, Native AOT, cold starts; when serverless fits and when it does not."}, {"id": "fd175c2fe", "text": "Identity: Entra ID app registrations, managed identities, `DefaultAzureCredential`, workload identity federation."}, {"id": "f40e8cac5", "text": "Network security: Key Vault, private endpoints, VNet integration, WAF."}, {"id": "f6f4dc28e", "text": "Cost: scale-to-zero, right-sizing, reservations, budgets and tags; Well-Architected pillars."}]}, {"sec": "AI and LLMs for .NET", "group": "", "note": "", "items": [{"id": "f274f3556", "text": "Tokens, context window, sampling, embeddings, hallucination, grounding."}, {"id": "f57d4b0ff", "text": "Prompting: system prompts, few-shot examples, structured outputs with JSON schema."}, {"id": "fb90fcc5c", "text": "Microsoft.Extensions.AI: `IChatClient`, `IEmbeddingGenerator`, middleware for tools, caching and telemetry."}, {"id": "f57500d08", "text": "Calling Claude, OpenAI and Microsoft Foundry (formerly Azure AI Foundry) from C#: streaming, tool use, prompt caching, rate limits."}, {"id": "f9333ca17", "text": "RAG: chunking, embeddings, vector store, hybrid search, reranking, citations."}, {"id": "f5031c057", "text": "Vector stores: Azure AI Search, pgvector, Qdrant; Microsoft.Extensions.VectorData."}, {"id": "fdbd886a6", "text": "RAG evaluation: groundedness, relevance, recall@k; golden datasets; Microsoft.Extensions.AI.Evaluation."}, {"id": "f9c12b1fe", "text": "Tool calling safety: read-only tools by default, confirmation for actions, least privilege, logging every call."}, {"id": "f97d5b4a2", "text": "MCP: servers and clients, tools/resources/prompts, stdio vs streamable HTTP, OAuth; official C# SDK."}, {"id": "f07746534", "text": "A2A protocol: agent cards and tasks for agent-to-agent calls."}, {"id": "fe6aa184e", "text": "Microsoft Agent Framework (1.0 GA, April 2026; successor to Semantic Kernel and AutoGen): agents, threads, tools, middleware, workflows with checkpointing."}, {"id": "f087ffef1", "text": "LLM ops: token cost, caching, model routing, streaming for latency, prompt injection, PII redaction, OTel GenAI metrics."}, {"id": "f17cf47ac", "text": "AI in fintech: realistic use cases, model risk, explainability, audit trail, human approval, data residency."}]}, {"sec": "System design (fintech)", "group": "", "note": "", "items": [{"id": "f35bf88bc", "text": "My framework: requirements, estimates, API, data model, high-level design, deep dives, trade-offs."}, {"id": "f7e14b913", "text": "Order matching engine: order book, price-time priority, single writer per symbol, event sourcing and replay."}, {"id": "f365e5c10", "text": "Payments: idempotency keys, double-entry ledger, sagas, reconciliation."}, {"id": "f40701139", "text": "Market-data distribution: snapshots plus deltas, conflation, fan-out, back-pressure."}, {"id": "fcc17d922", "text": "High-throughput event processing: partitioning and ordering, consumer groups, outbox, exactly-once effects through idempotency."}, {"id": "fb0c521e1", "text": "Low-latency .NET: allocation-free hot paths, Server GC vs workstation GC, GC settings, avoiding locks on the hot path."}, {"id": "f2abcf038", "text": "Back-of-the-envelope numbers: latency of memory, network and disk; messages per second per partition."}]}, {"sec": "Questions to ask them", "group": "", "note": "", "items": [{"id": "fe5ab99cc", "text": "Which legacy systems need supporting or migrating, and what is the current stack?"}, {"id": "fa307119f", "text": "How big is the backend team, and who would I work with most?"}, {"id": "fb6118387", "text": "How are deployments done today, and to which environments (Linux, Windows, cloud, on-premises)?"}, {"id": "f079ec5e2", "text": "What does after-hours support look like in practice?"}, {"id": "f4405e5e7", "text": "Which identity and integration platforms do you use (identity provider, API gateway, service bus)?"}, {"id": "fffe790f0", "text": "What would success look like in my first six months?"}]}], "stories": [{"id": "s7f5579ab", "text": "The race condition that opened duplicate positions, and the row-level locking fix.", "after": false}, {"id": "saaca4cd3", "text": "Removing ~3,600 queries per market event with the in-memory hierarchy cache.", "after": false}, {"id": "s78786b84", "text": "The order-routing migration: the plan, 34 architecture decisions, Off/Shadow/Active rollout, 1,000+ tests.", "after": false}, {"id": "sa33f38ec", "text": "The Oracle connection-pool leak: how you detected and fixed it.", "after": false}, {"id": "sefbb764d", "text": "Entry-price gaps in the market-data pipeline: instrumenting, stale-quote guard, supervised restarts.", "after": false}, {"id": "s50711f70", "text": "Security findings: SQL injection, credentials in logs, FIX logon without a password.", "after": false}, {"id": "s85e0be3a", "text": "Bootstrapping the SvelteKit admin and shipping Phase 1 in about three months.", "after": false}, {"id": "sf577abbd", "text": "A production incident handled after hours, under pressure.", "after": false}, {"id": "s367aa97c", "text": "Mentoring your two developers and your code review approach.", "after": false}, {"id": "s48939acf", "text": "A disagreement with a colleague or manager and how you resolved it.", "after": false}, {"id": "s6c2bc0ba", "text": "A mistake you made and what you learned.", "after": false}, {"id": "s8958caad", "text": "Turning a vague business request into a technical spec.", "after": false}, {"id": "s1378ec12", "text": "Why you are looking, and why this company.", "after": false}, {"id": "sa46f38fc", "text": "Upgrading a service from .NET 8 to .NET 10, with measured gains.", "after": true}, {"id": "sd664f0a1", "text": "Shipping TradeDesk AI: Aspire, Container Apps and a GitHub Actions OIDC pipeline.", "after": true}, {"id": "s87c60520", "text": "Building a RAG feature with an evaluation suite and grounding guardrails.", "after": true}, {"id": "s4200f4e0", "text": "Exposing trading data safely through a read-only MCP server.", "after": true}, {"id": "s1f8c01a7", "text": "Cutting allocations in a hot path, with BenchmarkDotNet evidence.", "after": true}, {"id": "sfc7f6363", "text": "Autoscaling a queue consumer with KEDA.", "after": true}], "cards": [{"id": "ca234e78f", "deck": "Modern C#", "q": "What does a C# 12 primary constructor parameter become on a class?", "a": "A captured parameter usable in the whole class body, not a readonly field (records generate public properties instead)."}, {"id": "c882180e4", "deck": "Modern C#", "q": "Write a collection expression that combines a fixed list and another sequence.", "a": "`List<string> s = [\"EURUSD\", ..others];` with the spread operator `..`."}, {"id": "c35de7ad3", "deck": "Modern C#", "q": "What does `System.Threading.Lock` (C# 13 / .NET 9) improve?", "a": "A dedicated lock type; `lock` on it uses `EnterScope()`, which is faster and clearer than locking on an object."}, {"id": "c68babc5a", "deck": "Modern C#", "q": "What can C# 14 extension blocks declare that classic extension methods cannot?", "a": "Extension properties, static extension members and operators, grouped in `extension(T x) { }` blocks."}, {"id": "c229db774", "deck": "Modern C#", "q": "What does the C# 14 `field` keyword do?", "a": "Refers to the compiler-generated backing field inside a property accessor, so you add logic without declaring a field."}, {"id": "c55ed0a54", "deck": "Modern C#", "q": "What is null-conditional assignment in C# 14?", "a": "`order?.Status = Filled;` assigns only when `order` is not null; also works with `+=` and other compound operators."}, {"id": "c3d86d004", "deck": "Modern C#", "q": "What is a C# 15 union type and its status today?", "a": "A value that is exactly one of a fixed set of case types, with exhaustive matching. Release candidate until .NET 11 GA (Nov 2026)."}, {"id": "cdc7e6ffa", "deck": "Modern C#", "q": "Union types vs closed hierarchies?", "a": "Unions group existing, possibly unrelated types; a `closed` base class defines one family whose subtypes live in the same assembly."}, {"id": "cfcb5706c", "deck": "Modern .NET", "q": "Which .NET versions lose support on Nov 10, 2026?", "a": ".NET 8 (LTS) and .NET 9 (STS). .NET 10 LTS runs to Nov 2028."}, {"id": "c256a4694", "deck": "Modern .NET", "q": "What replaced the .NET Upgrade Assistant?", "a": "The GitHub Copilot app modernization agent; Upgrade Assistant is deprecated."}, {"id": "cc616efc8", "deck": "Modern .NET", "q": "What replaced Swashbuckle in the ASP.NET Core templates?", "a": "Built-in `Microsoft.AspNetCore.OpenApi` document generation (OpenAPI 3.1 in .NET 10); add Scalar or Swagger UI separately."}, {"id": "c68316e58", "deck": "Modern .NET", "q": "How do you turn on built-in validation for minimal APIs in .NET 10?", "a": "`builder.Services.AddValidation();` then data annotations on parameters and DTOs are validated automatically."}, {"id": "c2e58cf3b", "deck": "Modern .NET", "q": "Two things HybridCache adds over IDistributedCache?", "a": "Stampede protection (one factory call per key) and two levels: in-memory L1 plus distributed L2, with tag invalidation."}, {"id": "c0a3a9722", "deck": "Modern .NET", "q": "What is runtime async in .NET 11?", "a": "The runtime handles async methods instead of compiler state machines: lower overhead, cleaner stack traces. Release candidate."}, {"id": "c9cc6c279", "deck": "Modern .NET", "q": "Which libraries in your stack became commercial?", "a": "MediatR (after 12.5), AutoMapper (after 14), MassTransit v9, FluentAssertions 8."}, {"id": "c4941c1bf", "deck": "Aspire", "q": "What are the AppHost and ServiceDefaults in Aspire?", "a": "AppHost models resources and their references; ServiceDefaults wires OpenTelemetry, health checks, resilience and service discovery into each service."}, {"id": "c403f2f68", "deck": "Aspire", "q": "How do you test a whole Aspire app?", "a": "Aspire.Hosting.Testing starts the AppHost in a test and gives you clients for each resource."}, {"id": "c13c6b8d4", "deck": "Aspire", "q": "What changed in Aspire 13?", "a": "Dropped \".NET\" from the name, became polyglot (Python, JavaScript), added `aspire do` pipelines and a dashboard MCP server; needs the .NET 10 SDK."}, {"id": "ccbf0119e", "deck": "Performance", "q": "When does `Span<T>` beat `Memory<T>`, and why can't Span cross `await`?", "a": "Span is a stack-only ref struct, so it is the fastest slice but cannot live on the heap, where an async state machine stores locals."}, {"id": "c0917d291", "deck": "Performance", "q": "What problem does ArrayPool solve?", "a": "Renting and returning buffers avoids allocating new arrays per message, cutting GC pressure on hot paths."}, {"id": "c27b7fd48", "deck": "Performance", "q": "What does BenchmarkDotNet's MemoryDiagnoser report?", "a": "Allocated bytes per operation and GC collections per generation."}, {"id": "cf07bb410", "deck": "Performance", "q": "What is a bounded Channel for?", "a": "A producer/consumer queue with a capacity limit, so a slow consumer creates back-pressure instead of unbounded memory growth."}, {"id": "ca179eec4", "deck": "Performance", "q": "What breaks under Native AOT?", "a": "Unbounded reflection, dynamic code generation, some serializers and libraries; fix with source generators and trimming annotations."}, {"id": "c1a9d23fd", "deck": "Performance", "q": "Name three source generators built into .NET.", "a": "`[GeneratedRegex]`, `[LoggerMessage]` and System.Text.Json `JsonSerializerContext` (also configuration binding)."}, {"id": "c15cda882", "deck": "gRPC", "q": "Name the four gRPC call types.", "a": "Unary, server streaming, client streaming, bidirectional streaming."}, {"id": "cece82a23", "deck": "gRPC", "q": "Why does gRPC need special load balancing?", "a": "HTTP/2 keeps one long connection, so L4 balancers pin all calls to one pod; use L7 (Envoy, YARP) or client-side balancing."}, {"id": "c5a63800c", "deck": "gRPC", "q": "What is a deadline in gRPC?", "a": "An absolute time limit the client sets; it propagates to the server, which cancels work after it passes."}, {"id": "ccf96ece0", "deck": "Kubernetes", "q": "Liveness vs readiness vs startup probe?", "a": "Liveness restarts a stuck container; readiness removes a pod from traffic; startup delays the other probes for slow starts."}, {"id": "cff201920", "deck": "Kubernetes", "q": "How should a .NET pod shut down gracefully?", "a": "Handle SIGTERM: stop accepting work, finish in-flight requests within `HostOptions.ShutdownTimeout`, before the termination grace period ends."}, {"id": "ca9652658", "deck": "Kubernetes", "q": "HPA vs KEDA?", "a": "HPA scales on CPU/memory or custom metrics; KEDA scales on event sources like queue length, including to zero."}, {"id": "c0a831862", "deck": "Kubernetes", "q": "Requests vs limits?", "a": "Requests are what the scheduler reserves; limits cap usage. CPU limits throttle; memory limits kill the pod (OOMKilled)."}, {"id": "c46428da4", "deck": "Kubernetes", "q": "What does Helm add over raw manifests?", "a": "Templated, versioned charts with per-environment values, release history and rollback."}, {"id": "c99a8a80a", "deck": "CI/CD and IaC", "q": "GitLab `stages` and `needs` map to what in GitHub Actions?", "a": "Jobs linked with `needs:`; there is no separate stages keyword."}, {"id": "cfa0bf7a4", "deck": "CI/CD and IaC", "q": "Why use OIDC from CI to the cloud?", "a": "The pipeline gets short-lived tokens through a federated identity, so no long-lived cloud secret is stored."}, {"id": "c01862969", "deck": "CI/CD and IaC", "q": "Bicep vs Terraform in one line?", "a": "Bicep is Azure-only and uses Azure as state; Terraform is multi-cloud and keeps its own state file that must be locked."}, {"id": "cca687772", "deck": "CI/CD and IaC", "q": "What does Terraform state locking prevent?", "a": "Two applies changing the same infrastructure at once and corrupting state."}, {"id": "c7a73cf44", "deck": "Azure and AWS", "q": "Service Bus feature that gives ordered processing per key?", "a": "Sessions: messages with the same session ID are delivered in order to one receiver."}, {"id": "cef98c12a", "deck": "Azure and AWS", "q": "Event Hubs vs Service Bus?", "a": "Event Hubs is a partitioned event stream for high volume; Service Bus is a broker for commands with DLQ, sessions and transactions."}, {"id": "c2e109f29", "deck": "Azure and AWS", "q": "Container Apps vs AKS?", "a": "Container Apps is serverless containers with KEDA and revisions, no cluster to run; AKS gives the full Kubernetes API for complex platforms."}, {"id": "c27489d23", "deck": "Azure and AWS", "q": "AWS equivalents of App Service, Container Apps, AKS, Functions?", "a": "App Runner or Elastic Beanstalk, ECS on Fargate, EKS, Lambda."}, {"id": "cf64162aa", "deck": "Azure and AWS", "q": "What is a Cosmos DB partition key decision about?", "a": "Spreading load and storage evenly while keeping common queries inside one partition."}, {"id": "cab7def40", "deck": "Azure and AWS", "q": "Which Azure Functions model must .NET apps use after Nov 10, 2026?", "a": "The isolated worker model; in-process support ends that day."}, {"id": "c1580d199", "deck": "Azure and AWS", "q": "Two ways to reduce .NET Lambda cold starts?", "a": "SnapStart and Native AOT (plus right-sizing memory)."}, {"id": "c57fa2757", "deck": "Azure and AWS", "q": "What does `DefaultAzureCredential` do?", "a": "Tries a chain of credentials (environment, workload identity, managed identity, developer login) so the same code works locally and in Azure without secrets."}, {"id": "cd5eccd47", "deck": "AI and LLMs", "q": "What is Microsoft.Extensions.AI's core abstraction?", "a": "`IChatClient` (plus `IEmbeddingGenerator`), with middleware for function calling, caching and telemetry."}, {"id": "c97eadb49", "deck": "AI and LLMs", "q": "What is an embedding?", "a": "A vector of numbers representing meaning, so similar texts are close in vector space."}, {"id": "c87811de9", "deck": "AI and LLMs", "q": "Why hybrid search in RAG?", "a": "Keyword search catches exact terms (symbols, rule IDs); vector search catches meaning. Combining them plus reranking improves recall."}, {"id": "c1be7aef0", "deck": "AI and LLMs", "q": "How do you know a RAG system works?", "a": "Evaluate on a golden dataset: retrieval metrics (recall@k) and answer metrics (groundedness, relevance)."}, {"id": "c8f5d24d5", "deck": "AI and LLMs", "q": "What is MCP?", "a": "Model Context Protocol: a standard for exposing tools, resources and prompts from a server to any LLM client, over stdio or streamable HTTP."}, {"id": "cc6e19e76", "deck": "AI and LLMs", "q": "What is A2A?", "a": "Agent-to-agent protocol: agents publish agent cards and exchange tasks across vendors and runtimes."}, {"id": "caaf2042f", "deck": "AI and LLMs", "q": "What replaced Semantic Kernel and AutoGen?", "a": "Microsoft Agent Framework, 1.0 GA in April 2026 (`Microsoft.Agents.AI`)."}, {"id": "c0e504ca2", "deck": "AI and LLMs", "q": "Three controls for LLM features in fintech?", "a": "Human approval for any money-moving action, an audit trail of every prompt and answer, and cited, grounded answers."}, {"id": "caf19b03b", "deck": "AI and LLMs", "q": "How do you defend against prompt injection through tools?", "a": "Treat tool output as data, give tools least privilege (read-only by default), confirm side effects, and test with injection cases."}, {"id": "c8f5e9c5e", "deck": "AI and LLMs", "q": "What is Microsoft Foundry?", "a": "The renamed Azure AI Foundry: Microsoft's platform for models, agents and evaluations; Azure AI Services are now Foundry Tools."}, {"id": "cea55e80c", "deck": "System design", "q": "Why one writer per symbol in a matching engine?", "a": "Ordering is guaranteed without locks: each symbol's book is processed by one thread in sequence, and symbols scale out in parallel."}, {"id": "ce7ac2de4", "deck": "System design", "q": "What makes a payment API safe to retry?", "a": "An idempotency key stored with the result, so a repeated request returns the first outcome instead of charging twice."}, {"id": "c583c671b", "deck": "System design", "q": "What is conflation in market data?", "a": "Sending slow clients only the latest price per symbol instead of every tick, so they never fall behind."}, {"id": "c0fdb6f87", "deck": "System design", "q": "What does the transactional outbox guarantee?", "a": "The event is saved in the same transaction as the data change and published afterwards, so you never publish without committing or the reverse."}, {"id": "c7f0db37c", "deck": "System design", "q": "Double-entry ledger in one sentence?", "a": "Every movement writes equal debit and credit entries, so balances are derived from immutable entries and always reconcile."}], "capstone": {"name": "TradeDesk AI", "pitch": "A .NET 10 trading-desk backend where an AI assistant checks orders against the firm's trading rulebook before they are routed.", "parts": ["Order API (minimal APIs, built-in OpenAPI and validation) and a gRPC quote stream", "PostgreSQL with pgvector, Redis via HybridCache, Service Bus or RabbitMQ for order events", "Aspire AppHost for local orchestration, dashboard and integration tests", "RAG over a sample trading rulebook with citations and an evaluation suite", "Agent Framework agent using an MCP server with read-only portfolio and risk tools; human approval before any order action", "Bicep infrastructure, GitHub Actions with OIDC, deploy to Azure Container Apps", "OpenTelemetry traces and GenAI metrics, token and cost dashboard, audit log of every AI decision"]}, "guide": {"start": "<p>Your baseline is strong on fundamentals, Oracle, messaging and legacy migration. The gaps are modern C# and .NET 10, Kubernetes and cloud, and AI engineering; Part 2 maps them, and Part 3 schedules them.<\/p>\n<p>88 days and 228 hours, from Wed Oct 21, 2026 to Sat Jan 16, 2027: a 4-day kickoff, then 12 full weeks. Must-know gaps come first; the capstone closes it out.<\/p>\n<h3>How the plan works<\/h3>\n<p>Weeks run Sunday to Saturday, and Friday and Saturday are the 4-hour weekend days (Jordan's weekend); if yours is Saturday–Sunday, ask Claude to shift the plan.<\/p>\n<ul>\n<li><strong>Weekdays (2 h)<\/strong>: 15 min Foundations review from your prep doc, 75 min topic study, 30 min hands-on exercise.<\/li>\n<li><strong>Friday (4 h)<\/strong>: deep-dive topic with a bigger lab.<\/li>\n<li><strong>Saturday (4 h)<\/strong>: 2.5 h weekly mini project, 1 h self-assessment (score each topic of the week 1–5, list weak spots, plan next week), 30 min Foundations review.<\/li>\n<li><strong>Review days<\/strong>: Thu Nov 12, Thu Dec 3, Thu Dec 24 and Thu Jan 14 replace new material with spaced review, flashcards and a timed mock.<\/li>\n<li><strong>Daily Foundations rule<\/strong>: tick an item only when you can explain it out loud in under a minute. The Today tab picks three items for you each day.<\/li>\n<li><strong>Dates to watch<\/strong>: .NET 8 and .NET 9 support end on Tue Nov 10; .NET 11 GA lands at .NET Conf in mid-November, so recheck C# 15 status then and drop the \"release candidate\" label once it ships.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Phase<\/th>\n<th>Weeks<\/th>\n<th>Focus<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Modern .NET<\/td>\n<td>Kickoff–4<\/td>\n<td>C# 12–15, ASP.NET Core 10, gRPC, performance, Aspire, the upgrade<\/td>\n<\/tr>\n<tr>\n<td>Cloud and DevOps<\/td>\n<td>5–8<\/td>\n<td>Kubernetes, GitHub Actions, Bicep, Terraform, Azure, serverless, security<\/td>\n<\/tr>\n<tr>\n<td>AI engineering<\/td>\n<td>8–10<\/td>\n<td>LLM APIs, Microsoft.Extensions.AI, RAG, MCP, Agent Framework, LLM ops<\/td>\n<\/tr>\n<tr>\n<td>Design and capstone<\/td>\n<td>11–12<\/td>\n<td>Fintech system design, TradeDesk AI, certification, career<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>How to use your interview prep checklist<\/h3>\n<p>Study priority: the C# and .NET fast points first (quick wins, likely in any screening), then Priority 1 (the gaps between your CV and the posting), then Oracle. Tick each box once you can explain it out loud in under a minute, with an example from your own work where possible.<\/p>\n<p>The role: Backend Specialist, .NET Core, mainly Oracle, integrations, legacy migration (SOAP, Web Forms, MVC), fintech.<\/p>\n<p>Updated Oct 20, 2026 for .NET 10 LTS and for any senior .NET backend role. The sections from \"Modern C# (12 to 15)\" onward close the gaps listed in Part 2, and Part 4 of this guide and the Foundations tab hold every checklist item.<\/p>", "fact": "<h2>Fact check and what changed<\/h2>\n<p>All seven facts in your brief are correct as of October 20, 2026. The additions below change what you should say in interviews.<\/p>\n<table>\n<thead>\n<tr>\n<th>Topic<\/th>\n<th>Status today<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>.NET 11<\/td>\n<td>RC2 shipped Oct 13, 2026 with a go-live license; GA at .NET Conf in November. It is STS (24 months), not LTS.<\/td>\n<\/tr>\n<tr>\n<td>C# 15<\/td>\n<td>Default on net11.0 since RC1. Also adds labeled break/continue and the start of a new memory-safety model. Say \"release candidate\" until GA.<\/td>\n<\/tr>\n<tr>\n<td>Runtime async<\/td>\n<td>No opt-in flag needed on net11.0; the BCL is compiled with it. Release candidate.<\/td>\n<\/tr>\n<tr>\n<td>.NET 10 / 9 / 8<\/td>\n<td>.NET 10 LTS supported to Nov 14, 2028. .NET 9 STS also ends Nov 10, 2026, the same day as .NET 8.<\/td>\n<\/tr>\n<tr>\n<td>Aspire<\/td>\n<td>Renamed at v13 (Nov 2025); needs the .NET 10 SDK; adds <code>aspire do<\/code> pipelines and a dashboard MCP server.<\/td>\n<\/tr>\n<tr>\n<td>Microsoft Foundry<\/td>\n<td>Renamed at Ignite, Nov 2025. Azure AI Services are now \"Foundry Tools\"; Azure AI Search keeps its name.<\/td>\n<\/tr>\n<tr>\n<td>Agent Framework<\/td>\n<td>1.0 on Apr 3, 2026 (<code>Microsoft.Agents.AI<\/code>), MCP and A2A built in; AutoGen is in maintenance mode.<\/td>\n<\/tr>\n<tr>\n<td>Certifications<\/td>\n<td>AI-200 available Jul 9, 2026. AI-103 (AI Apps and Agents Developer) replaced AI-102.<\/td>\n<\/tr>\n<tr>\n<td>Azure Functions<\/td>\n<td>In-process ends Nov 10, 2026; runtime v1.x already ended Sep 14, 2026.<\/td>\n<\/tr>\n<tr>\n<td>.NET Upgrade Assistant<\/td>\n<td>Deprecated; Microsoft now points to the GitHub Copilot app modernization agent.<\/td>\n<\/tr>\n<tr>\n<td>Your OSS stack<\/td>\n<td>MediatR (after 12.5), AutoMapper (after 14), MassTransit v9 and FluentAssertions 8 are now commercial for most companies.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Outdated items in \"Backend Specialist Interview Prep\"<\/h3>\n<p>The doc was written against .NET 8. These are the items to replace; everything else still holds.<\/p>\n<table>\n<thead>\n<tr>\n<th>Doc item<\/th>\n<th>Problem<\/th>\n<th>Replace with<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>.NET Framework \"4.8 is the last\"<\/td>\n<td>Imprecise<\/td>\n<td>4.8.1 is the final .NET Framework release<\/td>\n<\/tr>\n<tr>\n<td>\"Current LTS releases are the even numbers\"<\/td>\n<td>Missing today's versions<\/td>\n<td>.NET 10 is the current LTS (to Nov 2028); .NET 8 and 9 end Nov 10, 2026; STS is now 24 months<\/td>\n<\/tr>\n<tr>\n<td>\".NET Framework to .NET 8 path: .NET Upgrade Assistant\"<\/td>\n<td>Wrong target, deprecated tool<\/td>\n<td>Target .NET 10 LTS; use the GitHub Copilot app modernization agent, or System.Web adapters + YARP for incremental ASP.NET migration<\/td>\n<\/tr>\n<tr>\n<td>\"API versioning, OpenAPI/Swagger\"<\/td>\n<td>Swashbuckle no longer in templates<\/td>\n<td>Built-in <code>Microsoft.AspNetCore.OpenApi<\/code> (OpenAPI 3.1 in .NET 10), Scalar or Swagger UI as add-ons<\/td>\n<\/tr>\n<tr>\n<td>\"Validation: data annotations or FluentValidation\"<\/td>\n<td>Missing the built-in option<\/td>\n<td>.NET 10 minimal APIs have built-in validation via <code>AddValidation()<\/code><\/td>\n<\/tr>\n<tr>\n<td>\"Caching (in-memory vs distributed)\"<\/td>\n<td>Missing the default API<\/td>\n<td>HybridCache (L1 + L2, stampede protection, tags)<\/td>\n<\/tr>\n<tr>\n<td>\"Extension methods: static methods in a static class\"<\/td>\n<td>Incomplete<\/td>\n<td>Still valid, plus C# 14 extension blocks for properties, static members and operators<\/td>\n<\/tr>\n<tr>\n<td>\"Thread safety: lock, SemaphoreSlim…\"<\/td>\n<td>Missing the new type<\/td>\n<td><code>System.Threading.Lock<\/code> (.NET 9) as the lock object<\/td>\n<\/tr>\n<tr>\n<td>\"FrozenDictionary in .NET 8\"<\/td>\n<td>Dated framing<\/td>\n<td>Still valid; .NET 9 adds <code>AlternateLookup<\/code> for span keys<\/td>\n<\/tr>\n<tr>\n<td>\"Task vs ValueTask\" and async items<\/td>\n<td>Missing the next step<\/td>\n<td>Note runtime async in .NET 11 (release candidate)<\/td>\n<\/tr>\n<tr>\n<td>\"Docker: multi-stage Dockerfile\"<\/td>\n<td>Incomplete<\/td>\n<td>Also SDK container publishing and chiseled images<\/td>\n<\/tr>\n<tr>\n<td>MediatR / MassTransit / FluentAssertions in your patterns<\/td>\n<td>Licensing changed<\/td>\n<td>Know the last free versions and alternatives (Wolverine, Brighter, hand-rolled mediator, Shouldly)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Items tied to .NET 8 that are still correct and stay as they are: keyed services, <code>IExceptionHandler<\/code>, <code>TimeProvider<\/code>, middleware order, Hosting Bundle and IIS hosting.<\/p>", "kmap": "<h2>Knowledge map<\/h2>\n<p>36 topics, about 212 study hours: 157 h Must-know, 47 h Should-know, 8 h Nice-to-have. The roadmap's 228 hours add review days and self-assessments on top.<\/p>\n<table>\n<thead>\n<tr>\n<th>Area<\/th>\n<th>Topic<\/th>\n<th>Priority<\/th>\n<th>Hours<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Modern .NET &amp; C#<\/td>\n<td>C# 12, 13 and 14 features<\/td>\n<td>Must<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>Modern .NET &amp; C#<\/td>\n<td>C# 15: unions and closed hierarchies (release candidate)<\/td>\n<td>Should<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>Modern .NET &amp; C#<\/td>\n<td>.NET 9 and 10 runtime and library changes<\/td>\n<td>Must<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>Modern .NET &amp; C#<\/td>\n<td>Upgrading .NET 8 to .NET 10 LTS<\/td>\n<td>Must<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td>Modern .NET &amp; C#<\/td>\n<td>ASP.NET Core 10: OpenAPI, validation, SSE, passkeys<\/td>\n<td>Must<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>Modern .NET &amp; C#<\/td>\n<td>HybridCache and output caching<\/td>\n<td>Must<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>Modern .NET &amp; C#<\/td>\n<td>Aspire (formerly .NET Aspire)<\/td>\n<td>Must<\/td>\n<td>10<\/td>\n<\/tr>\n<tr>\n<td>Modern .NET &amp; C#<\/td>\n<td>Source generators<\/td>\n<td>Should<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>Modern .NET &amp; C#<\/td>\n<td>Native AOT and trimming<\/td>\n<td>Should<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>Modern .NET &amp; C#<\/td>\n<td>gRPC in depth<\/td>\n<td>Must<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>Modern .NET &amp; C#<\/td>\n<td>Performance engineering<\/td>\n<td>Must<\/td>\n<td>10<\/td>\n<\/tr>\n<tr>\n<td>Modern .NET &amp; C#<\/td>\n<td>File-based apps and runtime async<\/td>\n<td>Nice<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>Modern .NET &amp; C#<\/td>\n<td>OSS license changes in your stack<\/td>\n<td>Must<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>Cloud &amp; DevOps<\/td>\n<td>Kubernetes for .NET apps<\/td>\n<td>Must<\/td>\n<td>14<\/td>\n<\/tr>\n<tr>\n<td>Cloud &amp; DevOps<\/td>\n<td>Helm and Kustomize<\/td>\n<td>Should<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>Cloud &amp; DevOps<\/td>\n<td>GitHub Actions (mapped from GitLab CI)<\/td>\n<td>Must<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>Cloud &amp; DevOps<\/td>\n<td>Azure DevOps Pipelines<\/td>\n<td>Should<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>Cloud &amp; DevOps<\/td>\n<td>Bicep<\/td>\n<td>Should<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>Cloud &amp; DevOps<\/td>\n<td>Terraform<\/td>\n<td>Should<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td>Cloud &amp; DevOps<\/td>\n<td>Azure core services and AWS equivalents<\/td>\n<td>Must<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>Cloud &amp; DevOps<\/td>\n<td>Azure Service Bus, Event Hubs, Event Grid<\/td>\n<td>Must<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>Cloud &amp; DevOps<\/td>\n<td>Azure Functions (isolated) and Durable Functions<\/td>\n<td>Should<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>Cloud &amp; DevOps<\/td>\n<td>AWS Lambda with .NET<\/td>\n<td>Nice<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>Cloud &amp; DevOps<\/td>\n<td>Cloud identity, security and cost<\/td>\n<td>Must<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>AI &amp; LLMs<\/td>\n<td>LLM fundamentals<\/td>\n<td>Must<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>AI &amp; LLMs<\/td>\n<td>Microsoft.Extensions.AI<\/td>\n<td>Must<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>AI &amp; LLMs<\/td>\n<td>Calling Claude, OpenAI and Foundry from C#<\/td>\n<td>Must<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td>AI &amp; LLMs<\/td>\n<td>RAG, vector databases and evaluation<\/td>\n<td>Must<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>AI &amp; LLMs<\/td>\n<td>Tool calling, MCP and A2A<\/td>\n<td>Must<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>AI &amp; LLMs<\/td>\n<td>Microsoft Agent Framework<\/td>\n<td>Should<\/td>\n<td>10<\/td>\n<\/tr>\n<tr>\n<td>AI &amp; LLMs<\/td>\n<td>LLM cost, latency, safety and observability<\/td>\n<td>Must<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>AI &amp; LLMs<\/td>\n<td>AI in fintech<\/td>\n<td>Should<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>AI &amp; LLMs<\/td>\n<td>AI coding assistants and agents<\/td>\n<td>Should<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>System Design &amp; Career<\/td>\n<td>System design: fintech scenarios<\/td>\n<td>Must<\/td>\n<td>14<\/td>\n<\/tr>\n<tr>\n<td>System Design &amp; Career<\/td>\n<td>Portfolio and capstone<\/td>\n<td>Must<\/td>\n<td>22<\/td>\n<\/tr>\n<tr>\n<td>System Design &amp; Career<\/td>\n<td>Certifications in 2026<\/td>\n<td>Nice<\/td>\n<td>2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>A. Modern .NET &amp; C<\/h2>\n<h3>C# 12, 13 and 14 features<\/h3>\n<p><strong>Must<\/strong> · about 6 h. Interviewers now expect C# 12–14 idioms in live coding, and modern codebases already use them. Not knowing primary constructors or collection expressions signals you stopped at .NET 8.<\/p>\n<p>Key concepts: primary constructors and collection expressions (12); params collections, <code>System.Threading.Lock<\/code>, partial properties (13); extension members, <code>field<\/code> keyword, null-conditional assignment, implicit span conversions (14).<\/p>\n<pre><code class=\"language-csharp\">// C# 12 primary constructor + collection expression\n// Before\npublic class OrderService { private readonly IOrderRepo _repo; public OrderService(IOrderRepo repo) =&gt; _repo = repo; }\nvar symbols = new List&lt;string&gt; { &quot;EURUSD&quot;, &quot;GBPUSD&quot; };\n// After\npublic class OrderService(IOrderRepo repo) { /* use repo directly */ }\nList&lt;string&gt; symbols = [&quot;EURUSD&quot;, &quot;GBPUSD&quot;, ..extraSymbols];\n\n// C# 13 dedicated lock type\n// Before: private readonly object _gate = new();   lock (_gate) { ... }\nprivate readonly Lock _gate = new();\nlock (_gate) { /* compiler uses Lock.EnterScope() */ }\n\n// C# 14 extension members: properties and static members, not just methods\n// Before: public static bool IsEmpty&lt;T&gt;(this IEnumerable&lt;T&gt; s) =&gt; !s.Any();\npublic static class EnumerableExtensions\n{\n    extension&lt;T&gt;(IEnumerable&lt;T&gt; source)\n    {\n        public bool IsEmpty =&gt; !source.Any();   // extension property\n    }\n}\n\n// C# 14 field keyword\n// Before: private string _symbol; public string Symbol { get =&gt; _symbol; set =&gt; _symbol = value.Trim(); }\npublic string Symbol { get; set =&gt; field = value.Trim(); }\n\n// C# 14 null-conditional assignment\n// Before: if (order is not null) order.Status = OrderStatus.Filled;\norder?.Status = OrderStatus.Filled;\n<\/code><\/pre>\n<p>Resources: <a href=\"https://learn.microsoft.com/dotnet/csharp/whats-new/csharp-14\">What's new in C# 14<\/a> · <a href=\"https://learn.microsoft.com/dotnet/csharp/whats-new/csharp-13\">What's new in C# 13<\/a> · <a href=\"https://learn.microsoft.com/dotnet/csharp/whats-new/csharp-12\">What's new in C# 12<\/a><\/p>\n<p>Your angle: refactor a MediatR handler and your extension-method helpers to see the difference.<\/p>\n<h3>C# 15: unions and closed hierarchies (release candidate)<\/h3>\n<p><strong>Should<\/strong> · about 3 h. Union types are the biggest modeling change in C# in years and replace libraries like OneOf and ErrorOr. Present them as release candidate until .NET 11 GA in November 2026.<\/p>\n<p>Key concepts: <code>union<\/code> declarations with exhaustive <code>switch<\/code>; <code>closed<\/code> classes (subtypes only in the same assembly, implicitly abstract); collection expression arguments, extension indexers, labeled break/continue.<\/p>\n<pre><code class=\"language-csharp\">// Before: exceptions or a OneOf&lt;Accepted, Rejected&gt; library type\n// After (C# 15, net11.0, release candidate)\npublic record Accepted(long OrderId);\npublic record Rejected(string Reason);\npublic union OrderResult(Accepted, Rejected);\n\nstring Describe(OrderResult r) =&gt; r switch\n{\n    Accepted a =&gt; $&quot;Accepted {a.OrderId}&quot;,\n    Rejected x =&gt; $&quot;Rejected: {x.Reason}&quot;,   // compiler checks exhaustiveness\n};\n\n// Closed hierarchy: one family you own\npublic closed record OrderState;\npublic record New : OrderState;\npublic record Filled : OrderState;\n<\/code><\/pre>\n<p>How it changes modeling: expected failures (risk limit, market closed) become values the compiler forces you to handle, and exceptions go back to being for the unexpected. Unions group existing unrelated types; closed hierarchies define one family you own.<\/p>\n<p>Resources: <a href=\"https://learn.microsoft.com/dotnet/csharp/whats-new/csharp-15\">What's new in C# 15<\/a> · <a href=\"https://learn.microsoft.com/dotnet/core/whats-new/dotnet-11/overview\">What's new in .NET 11<\/a><\/p>\n<p>Your angle: model order rejection reasons as a union instead of exceptions.<\/p>\n<h3>.NET 9 and 10 runtime and library changes<\/h3>\n<p><strong>Must<\/strong> · about 4 h. .NET 10 is the LTS everyone is moving to. Knowing what changed in the runtime and BCL lets you justify the upgrade with numbers.<\/p>\n<p>Key concepts: JIT escape analysis, devirtualization, Dynamic PGO; GC DATAS for containers; <code>Task.WhenEach<\/code>, <code>CountBy<\/code>/<code>AggregateBy<\/code>, <code>Guid.CreateVersion7<\/code>, <code>SearchValues<\/code>, <code>FrozenDictionary<\/code>.<\/p>\n<p>Resources: <a href=\"https://learn.microsoft.com/dotnet/core/whats-new/dotnet-10/overview\">What's new in .NET 10<\/a> · <a href=\"https://devblogs.microsoft.com/dotnet/performance-improvements-in-net-10/\">Performance improvements in .NET 10<\/a><\/p>\n<p>Your angle: benchmark one hot path from your trading core on .NET 8 vs .NET 10.<\/p>\n<h3>Upgrading .NET 8 to .NET 10 LTS<\/h3>\n<p><strong>Must<\/strong> · about 5 h. .NET 8 and .NET 9 both lose support on Nov 10, 2026, so every .NET shop is doing this now. It is a perfect interview story and extends your migration work.<\/p>\n<p>Steps: pin the SDK in global.json; change the TFM in Directory.Build.props; update packages with central package management; read the breaking-change list for each area you use (SDK, ASP.NET Core, EF Core, containers); run the full test suite; deploy one service first with a rollback plan. The GitHub Copilot app modernization agent replaces the deprecated Upgrade Assistant.<\/p>\n<p>Resources: <a href=\"https://learn.microsoft.com/dotnet/core/compatibility/10.0\">Breaking changes in .NET 10<\/a> · <a href=\"https://learn.microsoft.com/dotnet/core/porting/github-copilot-app-modernization/overview\">GitHub Copilot app modernization<\/a><\/p>\n<p>Your angle: pair it with your strangler-fig story; same discipline, smaller blast radius.<\/p>\n<h3>ASP.NET Core 10: OpenAPI, validation, SSE, passkeys<\/h3>\n<p><strong>Must<\/strong> · about 6 h. Templates no longer ship Swashbuckle, and minimal APIs gained built-in validation. Senior API work in 2026 assumes these defaults.<\/p>\n<p>Key concepts: <code>Microsoft.AspNetCore.OpenApi<\/code> (OpenAPI 3.1) with Scalar or Swagger UI as add-ons; <code>AddValidation()<\/code>, TypedResults, endpoint filters; Server-Sent Events; passkeys in Identity.<\/p>\n<p>Resources: <a href=\"https://learn.microsoft.com/aspnet/core/release-notes/aspnetcore-10.0\">What's new in ASP.NET Core 10<\/a> · <a href=\"https://learn.microsoft.com/aspnet/core/fundamentals/openapi/overview\">OpenAPI in ASP.NET Core<\/a><\/p>\n<p>Your angle: your typed SvelteKit client already mirrors OpenAPI.<\/p>\n<h3>HybridCache and output caching<\/h3>\n<p><strong>Must<\/strong> · about 2 h. HybridCache is the default caching API: L1 in-memory plus L2 distributed with stampede protection. It replaces hand-rolled cache-aside code.<\/p>\n<pre><code class=\"language-csharp\">var quote = await cache.GetOrCreateAsync($&quot;quote:{symbol}&quot;,\n    async ct =&gt; await repo.GetQuoteAsync(symbol, ct),\n    tags: [&quot;quotes&quot;]);   // one factory call even under a stampede\n<\/code><\/pre>\n<p>Resources: <a href=\"https://learn.microsoft.com/aspnet/core/performance/caching/hybrid\">HybridCache library<\/a><\/p>\n<p>Your angle: compare with your hierarchy cache that removed \\~3,600 queries per event.<\/p>\n<h3>Aspire (formerly .NET Aspire)<\/h3>\n<p><strong>Must<\/strong> · about 10 h. Aspire is how new .NET distributed apps are built and run locally, with OpenTelemetry, health checks and service discovery wired in. Version 13 made it polyglot and added deployment pipelines.<\/p>\n<pre><code class=\"language-csharp\">var builder = DistributedApplication.CreateBuilder(args);\nvar db = builder.AddPostgres(&quot;pg&quot;).AddDatabase(&quot;orders&quot;);\nvar mq = builder.AddRabbitMQ(&quot;mq&quot;);\nbuilder.AddProject&lt;Projects.OrderApi&gt;(&quot;order-api&quot;).WithReference(db).WithReference(mq);\nbuilder.Build().Run();\n<\/code><\/pre>\n<p>Resources: <a href=\"https://aspire.dev\">aspire.dev<\/a> · <a href=\"https://learn.microsoft.com/dotnet/aspire/\">Aspire on Microsoft Learn<\/a><\/p>\n<p>Your angle: model your gateway, REST API, RabbitMQ and Postgres topology in one AppHost.<\/p>\n<h3>Source generators<\/h3>\n<p><strong>Should<\/strong> · about 3 h. Source generators replace reflection in JSON, logging, regex and config binding, and they make Native AOT possible.<\/p>\n<p>Key concepts: incremental generators; <code>JsonSerializerContext<\/code>, <code>[LoggerMessage]<\/code>, <code>[GeneratedRegex]<\/code>; configuration binding generator.<\/p>\n<p>Resources: <a href=\"https://learn.microsoft.com/dotnet/csharp/roslyn-sdk/source-generators-overview\">Source generators overview<\/a><\/p>\n<p>Your angle: replace a hot-path log call with <code>[LoggerMessage]<\/code> and measure.<\/p>\n<h3>Native AOT and trimming<\/h3>\n<p><strong>Should<\/strong> · about 3 h. AOT gives fast startup and small memory for serverless, sidecars and CLIs. Know what breaks: reflection, dynamic code and some libraries.<\/p>\n<p>Key concepts: <code>PublishAot<\/code>, <code>CreateSlimBuilder<\/code>, request delegate generator; trimming warnings; when AOT is worth it.<\/p>\n<p>Resources: <a href=\"https://learn.microsoft.com/dotnet/core/deploying/native-aot/\">Native AOT deployment<\/a> · <a href=\"https://learn.microsoft.com/aspnet/core/fundamentals/native-aot\">ASP.NET Core Native AOT<\/a><\/p>\n<p>Your angle: publish a small FIX-utility CLI as AOT and compare startup.<\/p>\n<h3>gRPC in depth<\/h3>\n<p><strong>Must<\/strong> · about 6 h. gRPC is the default for service-to-service calls and streaming in many fintechs. Your TCP gateway and real-time API experience maps directly to its streaming model.<\/p>\n<p>Key concepts: unary, server, client and bidirectional streaming; deadlines, cancellation, interceptors, status codes; JSON transcoding, gRPC-Web; HTTP/2 connections need L7 or client-side load balancing.<\/p>\n<p>Resources: <a href=\"https://learn.microsoft.com/aspnet/core/grpc/\">gRPC on .NET<\/a> · <a href=\"https://grpc.io/docs/what-is-grpc/core-concepts/\">gRPC concepts<\/a><\/p>\n<p>Your angle: re-implement your real-time price stream as gRPC server streaming.<\/p>\n<h3>Performance engineering<\/h3>\n<p><strong>Must<\/strong> · about 10 h. Low-latency trading is your niche, and allocation-free code separates senior .NET engineers. Back every claim with BenchmarkDotNet numbers.<\/p>\n<p>Key concepts: Span/Memory, stackalloc, <code>string.Create<\/code>, UTF-8 literals; ArrayPool, ObjectPool, System.IO.Pipelines, Channels; BenchmarkDotNet with MemoryDiagnoser, baselines and multi-runtime jobs.<\/p>\n<p>Resources: <a href=\"https://benchmarkdotnet.org/articles/overview.html\">BenchmarkDotNet<\/a> · <a href=\"https://learn.microsoft.com/dotnet/standard/io/pipelines\">System.IO.Pipelines<\/a> · <a href=\"https://learn.microsoft.com/dotnet/core/extensions/channels\">Channels<\/a><\/p>\n<p>Your angle: your market-data pipeline and FIX parsing are the natural benchmark targets.<\/p>\n<h3>File-based apps and runtime async<\/h3>\n<p><strong>Nice<\/strong> · about 2 h. <code>dotnet run app.cs<\/code> makes C# usable for scripts and quick tools. Runtime async in .NET 11 (release candidate) moves async handling into the runtime for lower overhead and cleaner stack traces.<\/p>\n<p>Resources: <a href=\"https://learn.microsoft.com/dotnet/core/sdk/file-based-apps\">File-based apps<\/a> · <a href=\"https://learn.microsoft.com/dotnet/core/whats-new/dotnet-11/overview\">What's new in .NET 11<\/a><\/p>\n<p>Your angle: rewrite one ops script as a file-based app.<\/p>\n<h3>OSS license changes in your stack<\/h3>\n<p><strong>Must<\/strong> · about 1 h. MediatR, AutoMapper, MassTransit v9 and FluentAssertions 8 now need commercial licenses for most companies. A senior flags this before an AI agent or a junior adds the package.<\/p>\n<p>Key concepts: last free versions (MediatR 12.5, AutoMapper 14, MassTransit v8 with patches through 2026, FluentAssertions 7); alternatives (hand-rolled mediator, Wolverine, Brighter, Shouldly); license checks in CI.<\/p>\n<p>Your angle: your current stack uses three of these, so prepare a one-minute answer.<\/p>\n<h2>B. Cloud, Deployment &amp; DevOps<\/h2>\n<h3>Kubernetes for .NET apps<\/h3>\n<p><strong>Must<\/strong> · about 14 h. Most senior backend postings list Kubernetes, and it is your biggest DevOps gap after Docker. You need to deploy, debug and scale a .NET service on it.<\/p>\n<p>Key concepts: Pods, Deployments, Services, namespaces, Gateway API / Ingress; ConfigMaps, Secrets, probes mapped to ASP.NET health checks, graceful shutdown on SIGTERM; requests/limits and their effect on the GC; HPA, KEDA, AKS workload identity.<\/p>\n<p>Resources: <a href=\"https://kubernetes.io/docs/home/\">Kubernetes documentation<\/a> · <a href=\"https://learn.microsoft.com/azure/aks/\">AKS documentation<\/a> · <a href=\"https://keda.sh/docs/\">KEDA scalers<\/a><\/p>\n<p>Your angle: KEDA scaling on RabbitMQ queue depth maps to your dealer queue.<\/p>\n<h3>Helm and Kustomize<\/h3>\n<p><strong>Should<\/strong> · about 4 h. Helm is how teams package and version Kubernetes deployments. Read and write a chart with confidence.<\/p>\n<p>Key concepts: charts, templates, values, releases, rollback; Kustomize overlays vs Helm values.<\/p>\n<p>Resources: <a href=\"https://helm.sh/docs/\">Helm docs<\/a><\/p>\n<p>Your angle: package your multi-tenant admin deployment as a chart with per-tenant values.<\/p>\n<h3>GitHub Actions (mapped from GitLab CI)<\/h3>\n<p><strong>Must<\/strong> · about 6 h. GitHub Actions is the most common CI in job postings. You already know the concepts from GitLab, so this is mostly vocabulary.<\/p>\n<table>\n<thead>\n<tr>\n<th>Your GitLab CI<\/th>\n<th>GitHub Actions<\/th>\n<th>Azure DevOps<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>.gitlab-ci.yml<\/code> pipeline<\/td>\n<td>Workflow in <code>.github/workflows/*.yml<\/code><\/td>\n<td><code>azure-pipelines.yml<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>stages:<\/code><\/td>\n<td>Jobs linked with <code>needs:<\/code><\/td>\n<td><code>stages:<\/code><\/td>\n<\/tr>\n<tr>\n<td>Job <code>script:<\/code> lines<\/td>\n<td><code>steps:<\/code> with <code>run:<\/code> or <code>uses:<\/code> (actions)<\/td>\n<td><code>steps:<\/code> with <code>script:<\/code> or <code>task:<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>needs:<\/code><\/td>\n<td><code>needs:<\/code><\/td>\n<td><code>dependsOn:<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>parallel: matrix:<\/code><\/td>\n<td><code>strategy: matrix:<\/code><\/td>\n<td><code>strategy: matrix:<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>cache:<\/code> / <code>artifacts:<\/code><\/td>\n<td><code>actions/cache<\/code>, <code>upload-artifact<\/code><\/td>\n<td><code>Cache@2<\/code>, <code>PublishPipelineArtifact<\/code><\/td>\n<\/tr>\n<tr>\n<td>CI/CD variables (masked)<\/td>\n<td>Secrets and variables, per environment<\/td>\n<td>Variable groups, Key Vault link<\/td>\n<\/tr>\n<tr>\n<td><code>environment:<\/code> + manual job<\/td>\n<td>Environments with required reviewers<\/td>\n<td>Environments with approvals and checks<\/td>\n<\/tr>\n<tr>\n<td><code>include:<\/code> templates<\/td>\n<td>Reusable workflows, composite actions<\/td>\n<td>Templates<\/td>\n<\/tr>\n<tr>\n<td>Runners<\/td>\n<td>GitHub-hosted or self-hosted runners<\/td>\n<td>Microsoft-hosted or self-hosted agents<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Resources: <a href=\"https://docs.github.com/actions\">GitHub Actions docs<\/a> · <a href=\"https://docs.github.com/actions/migrating-to-github-actions/manually-migrating-to-github-actions/migrating-from-gitlab-cicd-to-github-actions\">Migrating from GitLab CI/CD<\/a><\/p>\n<p>Your angle: port your lint, typecheck, test, build, image, deploy pipeline one to one, then add OIDC so no cloud secret is stored.<\/p>\n<h3>Azure DevOps Pipelines<\/h3>\n<p><strong>Should<\/strong> · about 3 h. Banks and enterprises in the region still run Azure DevOps. The YAML model and templates (third column above) are enough for interviews.<\/p>\n<p>Resources: <a href=\"https://learn.microsoft.com/azure/devops/pipelines/\">Azure Pipelines docs<\/a><\/p>\n<h3>Bicep<\/h3>\n<p><strong>Should<\/strong> · about 4 h. Bicep is Azure's native IaC and the fastest way to deploy your capstone repeatably.<\/p>\n<p>Key concepts: resources, params, modules, outputs; <code>what-if<\/code>; deployment stacks.<\/p>\n<p>Resources: <a href=\"https://learn.microsoft.com/azure/azure-resource-manager/bicep/\">Bicep documentation<\/a><\/p>\n<h3>Terraform<\/h3>\n<p><strong>Should<\/strong> · about 5 h. Terraform is the multi-cloud IaC standard and appears in many postings. Know state and modules well.<\/p>\n<p>Key concepts: providers, resources, modules; remote state, locking, plan/apply, drift; Bicep vs Terraform (Azure-only and stateless vs multi-cloud with state).<\/p>\n<p>Resources: <a href=\"https://developer.hashicorp.com/terraform/docs\">Terraform docs<\/a> · <a href=\"https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs\">AzureRM provider<\/a><\/p>\n<p>Your angle: state locking is your row-level locking again: one writer at a time.<\/p>\n<h3>Azure core services and AWS equivalents<\/h3>\n<p><strong>Must<\/strong> · about 8 h. You need a confident map of where each workload runs and what it costs. Interviewers often ask you to pick a service and justify it.<\/p>\n<table>\n<thead>\n<tr>\n<th>Need<\/th>\n<th>Azure<\/th>\n<th>AWS<\/th>\n<th>Pick it when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Simple web app or API<\/td>\n<td>App Service<\/td>\n<td>App Runner, Elastic Beanstalk<\/td>\n<td>One service, no containers to manage<\/td>\n<\/tr>\n<tr>\n<td>Containers without managing a cluster<\/td>\n<td>Container Apps<\/td>\n<td>ECS on Fargate<\/td>\n<td>Microservices, scale to zero, KEDA built in<\/td>\n<\/tr>\n<tr>\n<td>Full Kubernetes<\/td>\n<td>AKS<\/td>\n<td>EKS<\/td>\n<td>You need the Kubernetes API, many services, platform team<\/td>\n<\/tr>\n<tr>\n<td>Event-driven functions<\/td>\n<td>Functions (isolated, Flex Consumption)<\/td>\n<td>Lambda<\/td>\n<td>Spiky, short, event-triggered work<\/td>\n<\/tr>\n<tr>\n<td>Commands and ordered messages<\/td>\n<td>Service Bus<\/td>\n<td>SQS (FIFO), Amazon MQ<\/td>\n<td>Your RabbitMQ use cases<\/td>\n<\/tr>\n<tr>\n<td>Event streams<\/td>\n<td>Event Hubs<\/td>\n<td>Kinesis, MSK<\/td>\n<td>High-volume telemetry or ticks<\/td>\n<\/tr>\n<tr>\n<td>Event routing<\/td>\n<td>Event Grid<\/td>\n<td>EventBridge<\/td>\n<td>Reacting to resource and app events<\/td>\n<\/tr>\n<tr>\n<td>Relational<\/td>\n<td>Azure SQL, PostgreSQL Flexible<\/td>\n<td>RDS, Aurora<\/td>\n<td>Your default<\/td>\n<\/tr>\n<tr>\n<td>Global NoSQL<\/td>\n<td>Cosmos DB<\/td>\n<td>DynamoDB<\/td>\n<td>Massive scale with a clear partition key<\/td>\n<\/tr>\n<tr>\n<td>Secrets<\/td>\n<td>Key Vault<\/td>\n<td>Secrets Manager, KMS<\/td>\n<td>Always<\/td>\n<\/tr>\n<tr>\n<td>Identity<\/td>\n<td>Entra ID, managed identities<\/td>\n<td>IAM roles<\/td>\n<td>Always<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Resources: <a href=\"https://learn.microsoft.com/azure/architecture/\">Azure Architecture Center<\/a> · <a href=\"https://learn.microsoft.com/azure/architecture/aws-professional/\">Azure for AWS professionals<\/a><\/p>\n<h3>Azure Service Bus, Event Hubs, Event Grid<\/h3>\n<p><strong>Must<\/strong> · about 3 h. These are the managed equivalents of your RabbitMQ and NATS work.<\/p>\n<p>Compared with your RabbitMQ setup: topics and subscriptions replace exchanges and bindings; sessions give FIFO per key (your per-symbol ordering); dead-letter queues and duplicate detection are built in; MassTransit can switch transport with little code. Event Hubs is a partitioned log like Kafka or JetStream, not a queue.<\/p>\n<p>Resources: <a href=\"https://learn.microsoft.com/azure/service-bus-messaging/\">Service Bus docs<\/a> · <a href=\"https://learn.microsoft.com/azure/service-bus-messaging/compare-messaging-services\">Compare messaging services<\/a><\/p>\n<h3>Azure Functions (isolated) and Durable Functions<\/h3>\n<p><strong>Should<\/strong> · about 6 h. The in-process model loses support on Nov 10, 2026, so migrations to the isolated worker are active work. Durable Functions fits settlement and approval workflows.<\/p>\n<p>Key concepts: isolated worker with DI, middleware, triggers and bindings; Flex Consumption plan; Durable patterns (chaining, fan-out/fan-in, human interaction, monitor).<\/p>\n<p>Resources: <a href=\"https://learn.microsoft.com/azure/azure-functions/dotnet-isolated-process-guide\">Isolated worker guide<\/a> · <a href=\"https://learn.microsoft.com/azure/azure-functions/durable/\">Durable Functions<\/a><\/p>\n<p>Your angle: compare Durable orchestrations to your Hangfire jobs.<\/p>\n<h3>AWS Lambda with .NET<\/h3>\n<p><strong>Nice<\/strong> · about 4 h. Needed mainly for AWS-first employers, but cold starts and when serverless fits are common questions. Serverless fits spiky, short, stateless work; it fits poorly for steady high throughput, long connections (FIX sessions, WebSockets) or strict latency.<\/p>\n<p>Key concepts: Lambda Annotations, ASP.NET Core on Lambda; cold starts (SnapStart, Native AOT, memory sizing); SQS triggers, API Gateway.<\/p>\n<p>Resources: <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-csharp.html\">Lambda with C#<\/a><\/p>\n<h3>Cloud identity, security and cost<\/h3>\n<p><strong>Must<\/strong> · about 6 h. Secretless deployments with managed identity are the expected standard. Cost awareness is a senior signal interviewers probe for.<\/p>\n<p>Key concepts: Entra ID app registrations, managed identities, <code>DefaultAzureCredential<\/code>, workload identity federation; Key Vault, private endpoints, VNet integration; budgets, scale-to-zero, reservations; Well-Architected pillars.<\/p>\n<p>Resources: <a href=\"https://learn.microsoft.com/entra/identity/managed-identities-azure-resources/overview\">Managed identities<\/a> · <a href=\"https://learn.microsoft.com/azure/well-architected/\">Azure Well-Architected Framework<\/a><\/p>\n<p>Your angle: connects to your credentials-in-logs and FIX-logon security fixes.<\/p>\n<h2>C. AI &amp; LLMs for .NET engineers<\/h2>\n<h3>LLM fundamentals<\/h3>\n<p><strong>Must<\/strong> · about 3 h. Every AI conversation in an interview builds on tokens, context and embeddings. You use these daily in PharmaIQ, so this is about naming them precisely.<\/p>\n<p>Key concepts: tokens, context window, sampling; embeddings and similarity; hallucination, grounding, structured outputs.<\/p>\n<p>Resources: <a href=\"https://docs.claude.com\">Claude API docs<\/a> · <a href=\"https://learn.microsoft.com/dotnet/ai/\">.NET AI docs<\/a><\/p>\n<p>Your angle: PharmaIQ's grounding checks and buffered stream are your best example.<\/p>\n<h3>Microsoft.Extensions.AI<\/h3>\n<p><strong>Must<\/strong> · about 3 h. It is the common abstraction every .NET AI library builds on, like <code>ILogger<\/code> for LLMs. It lets you swap providers and add caching, telemetry and tool calling as middleware.<\/p>\n<pre><code class=\"language-csharp\">IChatClient client = new ChatClientBuilder(innerClient)   // Claude, OpenAI, Foundry or Ollama\n    .UseFunctionInvocation()\n    .UseDistributedCache(cache)\n    .UseOpenTelemetry()\n    .Build();\nvar reply = await client.GetResponseAsync(&quot;Explain this trade&quot;, options);\n<\/code><\/pre>\n<p>Resources: <a href=\"https://learn.microsoft.com/dotnet/ai/microsoft-extensions-ai\">Microsoft.Extensions.AI<\/a><\/p>\n<p>Your angle: it works like MediatR pipeline behaviors, but for model calls.<\/p>\n<h3>Calling Claude, OpenAI and Microsoft Foundry from C<\/h3>\n<p><strong>Must<\/strong> · about 5 h. You must ship against real providers: streaming, tools, structured output, prompt caching and rate limits. Microsoft Foundry (formerly Azure AI Foundry) hosts OpenAI, Anthropic and other models for enterprises that need Azure contracts and data residency.<\/p>\n<p>Key concepts: official Anthropic and OpenAI .NET SDKs; Azure OpenAI and Foundry model deployments; Foundry Tools (formerly Azure AI Services); retries, rate limits, prompt caching.<\/p>\n<p>Resources: <a href=\"https://docs.claude.com\">Claude API docs<\/a> · <a href=\"https://learn.microsoft.com/azure/ai-foundry/\">Microsoft Foundry docs<\/a><\/p>\n<p>Your angle: port PharmaIQ's grounded summary pattern to C#.<\/p>\n<h3>RAG, vector databases and evaluation<\/h3>\n<p><strong>Must<\/strong> · about 12 h. RAG is the most requested AI skill for backend engineers, and it is mostly backend work: ingestion, indexing, retrieval and evaluation. Without evals you cannot claim it works.<\/p>\n<p>Key concepts: chunking, embeddings, hybrid search (keyword + vector), reranking, citations; Azure AI Search vs pgvector vs Qdrant; groundedness, relevance, recall@k, golden datasets; Microsoft.Extensions.VectorData and Microsoft.Extensions.AI.Evaluation.<\/p>\n<p>Resources: <a href=\"https://learn.microsoft.com/azure/search/\">Azure AI Search<\/a> · <a href=\"https://github.com/pgvector/pgvector\">pgvector<\/a> · <a href=\"https://learn.microsoft.com/dotnet/ai/evaluation/libraries\">Microsoft.Extensions.AI.Evaluation<\/a><\/p>\n<p>Your angle: your Postgres/TimescaleDB experience makes pgvector the natural start.<\/p>\n<h3>Tool calling, MCP and A2A<\/h3>\n<p><strong>Must<\/strong> · about 8 h. Tools are how LLMs reach real systems, and MCP is now the standard way to expose them. A2A covers agent-to-agent calls across vendors.<\/p>\n<p>Key concepts: tool schemas and <code>AIFunctionFactory<\/code>; read-only vs side-effecting tools, confirmation steps; MCP servers and clients, tools/resources/prompts, stdio vs streamable HTTP, OAuth; A2A agent cards and tasks.<\/p>\n<pre><code class=\"language-csharp\">// Minimal MCP server tool (ModelContextProtocol C# SDK)\n[McpServerToolType]\npublic static class PortfolioTools\n{\n    [McpServerTool, Description(&quot;Open positions for an account (read-only).&quot;)]\n    public static Task&lt;Position[]&gt; GetPositions(IPositionsRepo repo, string accountId)\n        =&gt; repo.GetOpenAsync(accountId);\n}\n<\/code><\/pre>\n<p>Resources: <a href=\"https://modelcontextprotocol.io\">Model Context Protocol<\/a> · <a href=\"https://github.com/modelcontextprotocol/csharp-sdk\">MCP C# SDK<\/a> · <a href=\"https://github.com/a2aproject/A2A\">A2A protocol<\/a><\/p>\n<p>Your angle: an MCP server over your Backoffice API library is a strong portfolio piece.<\/p>\n<h3>Microsoft Agent Framework<\/h3>\n<p><strong>Should<\/strong> · about 10 h. It is Microsoft's GA successor to Semantic Kernel and AutoGen (1.0, April 2026). Expect to meet Semantic Kernel code in existing projects: kernels and plugins map to agents and tools, and planners map to workflows.<\/p>\n<p>Key concepts: agents, threads, tools, middleware; graph workflows with checkpointing and human-in-the-loop; sequential, concurrent, handoff and group-chat orchestration; hosting through Foundry Agent Service.<\/p>\n<p>Resources: <a href=\"https://github.com/microsoft/agent-framework\">Agent Framework on GitHub<\/a> · <a href=\"https://learn.microsoft.com/agent-framework/\">Agent Framework docs<\/a><\/p>\n<p>Your angle: workflows with checkpoints resemble your durable dealer queue.<\/p>\n<h3>LLM cost, latency, safety and observability<\/h3>\n<p><strong>Must<\/strong> · about 3 h. Production AI fails on cost and safety, not on demos. Seniors are asked how they keep spend, latency and prompt injection under control.<\/p>\n<p>Key concepts: token budgets, prompt caching, model routing; streaming and smaller models for latency; prompt injection, PII redaction, content filters; OpenTelemetry GenAI conventions.<\/p>\n<p>Resources: <a href=\"https://opentelemetry.io/docs/specs/semconv/gen-ai/\">OpenTelemetry GenAI conventions<\/a> · <a href=\"https://genai.owasp.org/llm-top-10/\">OWASP Top 10 for LLM apps<\/a><\/p>\n<p>Your angle: your Datadog pack and redacted logging carry over directly.<\/p>\n<h3>AI in fintech<\/h3>\n<p><strong>Should<\/strong> · about 2 h. Regulated firms want AI but fear hallucinations and audit gaps. Realistic use cases: support assistants, KYC document extraction, alert triage, internal developer tools. Controls: human approval for any money-moving action, audit trail of every prompt and answer, explainable citations, data residency, model risk review.<\/p>\n<p>Resources: <a href=\"https://www.nist.gov/itl/ai-risk-management-framework\">NIST AI Risk Management Framework<\/a><\/p>\n<h3>AI coding assistants and agents<\/h3>\n<p><strong>Should<\/strong> · about 4 h. You already work AI-native. Turn it into a repeatable, explainable process: spec, plan, implement with tests, review; repo instruction files; review subagents; checking every AI-suggested package for license and supply-chain risk.<\/p>\n<p>Resources: <a href=\"https://docs.claude.com/en/docs/claude-code/overview\">Claude Code docs<\/a> · <a href=\"https://docs.github.com/copilot\">GitHub Copilot docs<\/a><\/p>\n<p>Your angle: PharmaIQ in two weeks with \\~220 tests is the proof point.<\/p>\n<h2>D. System design, portfolio and career<\/h2>\n<h3>System design: fintech scenarios<\/h3>\n<p><strong>Must<\/strong> · about 14 h. Senior interviews almost always include a design round, and trading scenarios let you lead with deep real experience. Use one framework every time: requirements, estimates, API, data model, high-level design, deep dives, trade-offs.<\/p>\n<table>\n<thead>\n<tr>\n<th>Scenario<\/th>\n<th>The deep dive interviewers want<\/th>\n<th>Your experience to bring<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Order matching engine<\/td>\n<td>Order book structure, price-time priority, single writer per symbol, event sourcing and replay, sequencer<\/td>\n<td>Order-routing engine, dealer queue, duplicate-positions race<\/td>\n<\/tr>\n<tr>\n<td>Payments system<\/td>\n<td>Idempotency keys, double-entry ledger, sagas with compensation, reconciliation<\/td>\n<td>Row-level locking, Oracle transactions<\/td>\n<\/tr>\n<tr>\n<td>Real-time market data<\/td>\n<td>Snapshots plus deltas, conflation for slow clients, fan-out, back-pressure<\/td>\n<td>Real-Time API, stale-quote guard, supervised consumers<\/td>\n<\/tr>\n<tr>\n<td>High-throughput event processing<\/td>\n<td>Partitioning and ordering, consumer groups, outbox, idempotent consumers, projections<\/td>\n<td>RabbitMQ, NATS JetStream, TimescaleDB tick data<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Resources: <a href=\"https://learn.microsoft.com/azure/architecture/patterns/\">Azure Architecture Center patterns<\/a> · <a href=\"https://dataintensive.net/\">Designing Data-Intensive Applications<\/a><\/p>\n<h3>Portfolio projects<\/h3>\n<p><strong>Must<\/strong> · about 22 h (capstone included). Your VertexFX work is private, so public code is what proves the new skills. Each weekly mini project in the roadmap is a small public repo; the capstone ties them together.<\/p>\n<ul>\n<li><strong>TradeDesk AI (capstone)<\/strong>: .NET 10 order API, gRPC quotes, Aspire, RAG over a trading rulebook, an agent using a read-only MCP server, deployed to Azure Container Apps with GitHub Actions.<\/li>\n<li><strong>Fast FIX Parser<\/strong>: allocation-free parsing with BenchmarkDotNet results; shows your low-latency niche.<\/li>\n<li><strong>VertexFX-style MCP server<\/strong>: read-only portfolio and risk tools; shows safe AI integration with trading data.<\/li>\n<li><strong>Upgrade kata<\/strong>: a .NET 8 to .NET 10 upgrade with a written change log; shows migration discipline.<\/li>\n<\/ul>\n<h3>Certifications in 2026: honest value<\/h3>\n<p>Certifications matter more for enterprise, consultancy and Gulf employers than for product companies, where your portfolio counts more. Take at most two.<\/p>\n<table>\n<thead>\n<tr>\n<th>Certification<\/th>\n<th>Value for you<\/th>\n<th>Verdict<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>AI-200 Azure AI Cloud Developer Associate<\/td>\n<td>Direct AZ-204 replacement; containers, vector databases, event-driven pipelines, Functions, monitoring. Lines up with weeks 4–9<\/td>\n<td>Take it first, around week 12<\/td>\n<\/tr>\n<tr>\n<td>CKAD<\/td>\n<td>Hands-on, vendor-neutral proof for your biggest gap; respected because it is a practical exam<\/td>\n<td>Strong second choice<\/td>\n<\/tr>\n<tr>\n<td>AI-103 Azure AI Apps and Agents Developer<\/td>\n<td>Agents and AI apps on Foundry; overlaps weeks 8–10<\/td>\n<td>Only if you target AI-heavy roles<\/td>\n<\/tr>\n<tr>\n<td>AZ-400 DevOps Engineer Expert<\/td>\n<td>Expert-level, needs an associate prerequisite (check the current list now that AZ-204 is retired)<\/td>\n<td>Later, if you move toward platform work<\/td>\n<\/tr>\n<tr>\n<td>AWS Developer Associate<\/td>\n<td>Useful only for AWS-first employers<\/td>\n<td>Skip unless a target job asks for it<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Resources: <a href=\"https://learn.microsoft.com/credentials/\">Microsoft Credentials<\/a> · <a href=\"https://training.linuxfoundation.org/certification/certified-kubernetes-application-developer-ckad/\">CKAD<\/a><\/p>\n<h3>New stories to add once the projects exist<\/h3>\n<ul>\n<li>Upgrading a service from .NET 8 to .NET 10, with measured gains.<\/li>\n<li>Shipping TradeDesk AI: Aspire, Container Apps and a GitHub Actions OIDC pipeline.<\/li>\n<li>Building a RAG feature with an evaluation suite and grounding guardrails.<\/li>\n<li>Exposing trading data safely through a read-only MCP server.<\/li>\n<li>Cutting allocations in a hot path, with BenchmarkDotNet evidence.<\/li>\n<li>Autoscaling a queue consumer with KEDA.<\/li>\n<\/ul>\n<p>The schedule for all of this is in Part 3.<\/p>", "cap": "<p>A .NET 10 trading-desk backend where an AI assistant checks orders against the firm's trading rulebook before a dealer approves them. Built in weeks 11–12, it reuses code from the Quote Service, Fast FIX Parser, Aspire-ify, Compliance RAG and Risk Analyst Agent mini projects.<\/p>", "cap_done": "<p>A trader submits an order to the Order API, which asks the Risk Agent for a check. The agent retrieves rulebook passages from pgvector and calls read-only MCP tools for positions, then returns a cited recommendation; only a dealer's approval publishes the order to Service Bus.<\/p>\n<p><strong>Definition of done<\/strong><\/p>\n<ul>\n<li>Runs locally with one <code>aspire run<\/code>; integration tests through Aspire.Hosting.Testing<\/li>\n<li>Deployed to Azure Container Apps with Bicep and a GitHub Actions workflow using OIDC (no stored secrets)<\/li>\n<li>RAG answers cite rulebook chunks; an eval suite of 20+ golden questions runs in CI<\/li>\n<li>The agent has no tool that changes data; every AI call is logged with tokens, cost and the final human decision<\/li>\n<li>README with architecture diagram, five ADRs, load-test results (p95/p99) and a 3-minute demo video<\/li>\n<\/ul>", "png": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABUAAAALeCAIAAADkryzRAAAQAElEQVR4nOydBXgUxxvGBydYcA/u7u5uxaGlxb1AoUaLO8UpFEqhQHF3d3d3D5AECZIQQgIJ/n+zQ+e/3ZPcRUgueX9Pnjx7e3u7s7OzM9/7fSOxP378KAghhBBCCCGEEBK5iSkIIYQQQgghhBAS6aGAJ4QQQgghhBBCHAAKeEIIIYQQQgghxAGggCeEEEIIIYQQQhwACnhCCCGEEEIIIcQBoIAnhBBCCCGEEEIcAAp4QgghhBBCCCHEAaCAJ4QQQgghhBBCHAAKeEIIIYQQQgghxAGggCeEEEIIIYQQQhwACnhCCCGEEEIIIcQBoIAnhBBCCCGEEEIcAAp4QgghhBBCCCHEAaCAJ4QQQgghhBBCHAAKeEIIIYQQQgghxAGggCeEEEIIIYQQQhwACnhCCCGEEEIIIcQBoIAnhBBCCCGEEEIcAAp4QgghhBBCCCHEAaCAJ4QQQgghhBBCHAAKeEIIIYQQQgghxAGggCeEEEIIIYQQQhwACnhCCCGEEEIIIcQBoIAnhBBCCCGEEEIcAAp4QgghhBBCCCHEAaCAJ4QQQgghhBBCHAAKeEIIIYQQQgghxAGggCeEEEIIIYQQQhwACnhCCCGEEEIIIcQBoIAnhBBCCCGEEEIcAAp4QgghhBBCCCHEAaCAJ4QQQgghhBBCHAAKeEIIIYQQQgghxAGggCeEEEIIIYQQQhwACnhCCCGEEEIIIcQBoIAnhBBCCCGEEEIcAAp4QgghhBBCCCHEAaCAJ4QQQgghhBBCHAAKeEIIIYQQQgghxAFwPAE/Y8aMRBrp0 /* ---------- state ---------- */
const blank = () => ({ v: 1, updatedAt: 0, days: {}, hours: {}, minis: {}, weekly: {}, found: {}, foundSeen: {}, topics: {}, notes: {}, stories: {}, cards: {}, quiz: {}, activity: {}, extra: [] });
function normalize(s) { const b = blank(); if (!s || typeof s !== "object") return b; for (const k of Object.keys(b)) if (s[k] !== undefined && typeof s[k] === typeof b[k] && Array.isArray(s[k]) === Array.isArray(b[k])) b[k] = s[k]; b.updatedAt = Number(s.updatedAt) || 0; return b; }
let state = blank();
try { const raw = localStorage.getItem(KEY); if (raw) state = normalize(JSON.parse(raw)); } catch (e) {}
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function commit(activity = true) {
  if (activity) state.activity[today()] = (state.activity[today()] || 0) + 1;
  state.updatedAt = Date.now(); saveLocal(); schedulePush(); renderTicker();
}

/* ---------- account sync (private per viewer) ---------- */
const sync = { ref: null, chain: Promise.resolve(), timer: null };
function setSync(mode) {
  const p = $("#syncPill"), t = $("#syncTxt");
  p.className = "pill" + (mode === "synced" ? " ok" : mode === "saving" ? " busy" : "");
  t.textContent = mode === "synced" ? "Synced to your account" : mode === "saving" ? "Saving…" : "This device only";
  p.title = mode === "local" ? "Progress is saved in this browser. Use Backup to export it." : "Progress is saved privately to your account and this browser.";
}
function schedulePush() { if (!sync.ref) return; clearTimeout(sync.timer); setSync("saving"); sync.timer = setTimeout(push, 1500); }
function push() {
  if (!sync.ref) return;
  const body = { state: JSON.stringify(state), updatedAt: state.updatedAt };
  if (body.state.length > 240000) { toast("Notes are getting large; export a backup and trim old notes."); }
  sync.chain = sync.chain.then(() => sync.ref.set(body)).then(() => setSync("synced"), e => { if (e && e.code === "invalid_argument") { sync.ref = null; setSync("local"); } else setSync("synced"); });
}
async function initSync() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [user, db] = await Promise.all([claude.use("user"), claude.use("db")]);
    if (!user || !db) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await ref.get();
    let remote = null;
    if (snap.exists) { try { remote = normalize(JSON.parse(snap.data().state)); } catch (e) {} }
    sync.ref = ref;
    if (remote && remote.updatedAt > state.updatedAt) { state = remote; saveLocal(); renderAll(); }
    else if (state.updatedAt > 0 && (!remote || state.updatedAt > remote.updatedAt)) push();
    setSync("synced");
    ref.onSnapshot(s => {
      if (!s.exists || s.metadata.hasPendingWrites) return;
      try { const r = normalize(JSON.parse(s.data().state)); if (r.updatedAt > state.updatedAt) { state = r; saveLocal(); renderAll(); } } catch (e) {}
    }, () => {});
  } catch (e) { sync.ref = null; setSync("local"); }
}

/* ---------- derived numbers ---------- */
function dayIndex() { return diffDays(DATA.start, today()); }
function curDay() { const i = dayIndex(); return (i >= 0 && i < DATA.days.length) ? DATA.days[i] : null; }
function curWeek() { const d = curDay(); if (d) return d.w; return dayIndex() < 0 ? 0 : 12; }
function hoursDone() { let h = 0; for (const d of DATA.days) if (state.days[d.id]) h += Number(state.hours[d.id] ?? d.hrs) || 0; for (const x of state.extra) h += Number(x.h) || 0; return Math.round(h * 10) / 10; }
function plannedToDate() { const t = today(); return DATA.days.filter(d => d.date <= t).reduce((a, d) => a + d.hrs, 0); }
function foundDone() { return ALLF.filter(f => state.found[f.id]).length; }
function daysDone() { return DATA.days.filter(d => state.days[d.id]).length; }
function streaks() {
  const act = state.activity; let cur = 0, d = today();
  if (!act[d]) d = addDays(d, -1);
  while (act[d]) { cur++; d = addDays(d, -1); }
  let best = 0, run = 0, prev = null;
  for (const k of Object.keys(act).filter(k => act[k]).sort()) { run = (prev && diffDays(prev, k) === 1) ? run + 1 : 1; best = Math.max(best, run); prev = k; }
  return { cur, best: Math.max(best, cur) };
}
function overall() { return Math.round((pct(daysDone(), DATA.days.length) + pct(foundDone(), ALLF.length)) / 2); }
function earned() {
  const s = streaks().best, h = hoursDone(), f = pct(foundDone(), ALLF.length), wk = w => DATA.days.filter(d => d.w === w).every(d => state.days[d.id]);
  const core = DATA.stories.filter(x => !x.after);
  return {
    first: Object.keys(state.activity).length > 0, streak3: s >= 3, streak7: s >= 7, streak14: s >= 14, streak30: s >= 30,
    h25: h >= 25, h50: h >= 50, h100: h >= 100, h200: h >= 200, f25: f >= 25, f50: f >= 50, f100: f >= 100,
    week1: wk(1), half: daysDone() >= 44, capstone: wk(12), quiz: Object.values(state.quiz).some(v => v >= 100),
    stories: core.every(x => (state.stories[x.id]?.count || 0) > 0), notes: Object.values(state.notes).filter(v => v && v.trim()).length >= 10,
  };
}

find() {
  const q = (ui.q || "").toLowerCase(), tr = ui.tr || "all", cat = ui.cat || "all", pr = ui.pr || "all", stt = ui.st || "all";
  let rows = [];

      <select id="st" aria-label="Status"><option value="all">Any status</option><option value="open" ${stt === "open" ? "selected" : ""}>Not done</option><option value="done" ${stt === "done" ? "selected" : ""}>Done</option></select>
    </div>
    <p class="small muted">${rows.length} result${rows.length === 1 ? "" : "s"}${rows.length > 120 ? " · showing the first 120" : ""}. Priority applies to roadmap days and topics.</p>
    <div>${shown.map(r => r.type === "found" ? `<div class="result">${foundItem(r.f, true).replace('class="item', 'style="display:contents" class="item')}</div>`
      : r.type === "road" ? `<div class="result"><input type="checkbox" id="s-${r.d.id}" data-day="${r.d.id}" ${r.done ? "checked" : ""}><div><div>${fmt(r.d.topic)}</div><div class="small muted">Roadmap · ${nice(r.d.date)} · ${esc(r.cat || "")} ${r.pri ? "· " + r.pri : ""}</div></div></div>`
      : `<div class="result"><span class="chip">Topic</span><div><button class="btn sm" type="button" data-open-topic="${r.t.id}" style="text-align:left">${esc(r.t.title)}</button><div class="small muted">${esc(r.cat)} · ${r.pri} · ${esc(state.topics[r.t.id] || "todo")}</div></div></div>`).join("") || `<p class="empty">Nothing matches.</p>`}</div></section>`;
},
data() {

};
const ui = {};

function weeklyForm(w, standalone) {

function topicCard(t) {
