/* ---------- timers ---------- */
const timers = {}; let runningId = null, tick = null;
const clock = s => { const n = Math.abs(s); return (s < 0 ? "+" : "") + Math.floor(n / 60) + ":" + pad(n % 60); };
function stopTimer(log) {
  if (!runningId) return; const id = runningId; clearInterval(tick); runningId = null;
  if (log && (timers[id] ?? 120) < 110) { const r = state.stories[id] || { count: 0 }; r.count = (r.count || 0) + 1; r.last = today(); state.stories[id] = r; commit(); }
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const b = ev.target.closest("button, [data-tab], #flip"); if (!b) return;
  const d = b.dataset;
  if (d.tab) return go(d.tab);
  if (d.jump) { document.getElementById(d.jump)?.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return; }
  if (b.id === "themeBtn") return cycleTheme();
  if (d.openTopic) { go("topics"); ui.ta = ui.tp = ui.ts = "all"; renderView(); const el = document.getElementById("topic-" + d.openTopic); if (el) { el.scrollIntoView({ block: "start" }); el.style.outline = "2px solid var(--accent)"; setTimeout(() => el.style.outline = "", 1600); } return; }
  if (d.toggleDay) { const id = d.toggleDay; if (state.days[id]) delete state.days[id]; else state.days[id] = today(); commit(!!state.days[id]); renderView(); if (state.days[id]) toast("Day filled. Nice work."); return; }
  if (d.explain) { state.found[d.explain] = state.found[d.explain] || today(); state.foundSeen[d.explain] = today(); commit(); renderView(); return; }
  if (d.notyet) { state.foundSeen[d.notyet] = today(); commit(); toast("Flagged for another pass. Check the Foundations tab."); return; }
  if (b.id === "extraAdd") { const m = Number($("#extraMin").value); if (!m || m <= 0) return toast("Enter minutes first."); state.extra.push({ date: today(), h: Math.round(m / 60 * 100) / 100, note: $("#extraNote").value.trim() }); commit(); renderView(); toast("Time logged."); return; }
  if (d.wscore) { const w = d.wscore; state.weekly[w] = { ...(state.weekly[w] || {}), score: Number(d.n) }; commit(); renderView(); return; }
  if (d.fm) { ui.fm = d.fm; renderView(); return; }
  if (d.tstat) { state.topics[d.tstat] = d.v; commit(); b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); return; }
  if (d.timer) { const id = d.timer; if (runningId === id) { stopTimer(true); renderView(); return; } stopTimer(true); runningId = id; if (timers[id] == null || timers[id] < -600) timers[id] = 120; tick = setInterval(() => { timers[id]--; const el = document.getElementById("tm-" + id); if (el) { el.textContent = clock(timers[id]); el.classList.toggle("over", timers[id] < 0); } }, 1000); renderView(); return; }
  if (d.reset) { if (runningId === d.reset) stopTimer(true); timers[d.reset] = 120; renderView(); return; }
  if (d.conf) { const r = state.stories[d.conf] || { count: 0 }; r.conf = Number(d.n); state.stories[d.conf] = r; commit(); renderView(); return; }
  if (d.deck) { ui.deck = d.deck; ui.ci = 0; ui.flipped = false; ui.quiz = null; renderView(); return; }
  if (d.pm) { ui.pm = d.pm; ui.quiz = null; renderView(); return; }
  if (b.id === "flip") { ui.flipped = !ui.flipped; b.classList.toggle("show", ui.flipped); return; }
  if (d.card) { state.cards[d.id] = d.card; commit(); ui.ci = d.card === "again" ? (ui.ci || 0) + 1 : (ui.ci || 0); ui.flipped = false; renderView(); return; }
  if (b.id === "quizStart") { ui.quiz = makeQuiz(ui.deck || DECKS[0]); renderView(); return; }
  if (d.opt != null && ui.quiz) { const qz = ui.quiz, it = qz.qs[qz.i]; qz.picked = Number(d.opt); if (it.opts[qz.picked] === it.a) qz.score++; renderView(); return; }
  if (b.id === "quizNext") { const qz = ui.quiz; qz.i++; qz.picked = null; if (qz.i >= qz.qs.length) { const sc = pct(qz.score, qz.qs.length); state.quiz[qz.deck] = Math.max(state.quiz[qz.deck] ?? 0, sc); commit(); } renderView(); return; }
  if (b.id === "expSave") return exportSave();
  if (b.id === "expCopy") return exportCopy();
  if (b.id === "impCheck") return importCheck();
  if (b.id === "impYes") { state = normalize(pendingImport); state.updatedAt = Date.now(); saveLocal(); schedulePush(); pendingImport = null; renderAll(); go("dashboard"); toast("Progress imported."); return; }
  if (b.id === "impNo") { pendingImport = null; $("#impConfirm").innerHTML = ""; return; }
  if (b.id === "resetAsk") { $("#resetBox").innerHTML = `<div class="confirm"><b>Erase all progress?</b><span class="small">Export a backup first if you might want it back.</span><div class="row"><button class="btn danger" type="button" id="resetYes">Erase everything</button><button class="btn" type="button" id="resetNo">Keep my progress</button></div></div>`; return; }
  if (b.id === "resetYes") { state = blank(); state.updatedAt = Date.now(); saveLocal(); schedulePush(); renderAll(); toast("Progress reset."); return; }
  if (b.id === "resetNo") { renderView(); return; }
});
document.addEventListener("keydown", ev => { if (ev.target.id === "flip" && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); ev.target.click(); } });
document.addEventListener("change", ev => {
  const t = ev.target, d = t.dataset;
  if (d.day) { if (t.checked) state.days[d.day] = today(); else delete state.days[d.day]; commit(t.checked); if (view === "guide") { t.closest(".day")?.classList.toggle("done", t.checked); return; } renderView(); return; }
  if (d.found) { if (t.checked) state.found[d.found] = today(); else delete state.found[d.found]; commit(t.checked); t.closest(".item")?.classList.toggle("done", t.checked); if (view !== "foundations" && view !== "guide") renderView(); return; }
  if (d.mini) { if (t.checked) state.minis[d.mini] = today(); else delete state.minis[d.mini]; commit(t.checked); return; }
  if (d.hrs) { const v = Math.max(0, Math.min(12, Number(t.value) || 0)); state.hours[d.hrs] = v; commit(false); return; }
  if (["ta","tp","ts"].includes(t.id)) { ui[t.id] = t.value; renderView(); return; }
  if (["tr","cat","pr","st"].includes(t.id)) { ui[t.id] = t.value; if (t.id === "tr") ui.cat = "all"; renderView(); return; }
  if (t.id === "impFile" && t.files[0]) { const r = new FileReader(); r.onload = () => { $("#impText").value = String(r.result); }; r.readAsText(t.files[0]); }
});
let noteT = null;
document.addEventListener("input", ev => {
  const t = ev.target, d = t.dataset;
  if (d.note || d.wnote) { clearTimeout(noteT); noteT = setTimeout(() => { if (d.note) state.notes[d.note] = t.value; else state.weekly[d.wnote] = { ...(state.weekly[d.wnote] || {}), note: t.value }; commit(false); }, 600); return; }
  if (t.id === "fq" || t.id === "q") { ui[t.id] = t.value; const pos = t.selectionStart; renderView(); const n = document.getElementById(t.id); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
});

/* ---------- quiz ---------- */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makeQuiz(deck) {
  const pool = DATA.cards.filter(c => c.deck === deck), others = DATA.cards.filter(c => c.deck !== deck);
  const qs = shuffle(pool).slice(0, Math.min(5, pool.length)).map(c => {
    let wrong = shuffle(pool.filter(x => x.id !== c.id)).slice(0, 3).map(x => x.a);
    if (wrong.length < 3) wrong = wrong.concat(shuffle(others).slice(0, 3 - wrong.length).map(x => x.a));
    return { q: c.q, a: c.a, opts: shuffle([c.a, ...wrong]) };
  });
  return { deck, qs, i: 0, score: 0, picked: null };
}

/* ---------- export / import ---------- */
const exportJson = () => JSON.stringify({ app: "senior-dotnet-tracker", exportedAt: new Date().toISOString(), ...state }, null, 2);
async function exportSave() {
  let dl = null; try { dl = window.claude?.use ? await claude.use("downloads") : null; } catch (e) {}
  if (!dl) { exportCopy(); toast("Download isn't available here, so the JSON is shown below to copy."); return; }
  try { await dl.save({ filename: `dotnet-study-progress-${today()}.json`, data: exportJson() }); toast("Backup saved."); }
  catch (e) { if (e && e.code === "declined") toast("Download cancelled."); else { exportCopy(); toast("Couldn't save the file, so the JSON is shown below."); } }
}
async function exportCopy() {
  const ta = $("#expText"); ta.hidden = false; ta.value = exportJson();
  try { await navigator.clipboard.writeText(ta.value); toast("Copied to clipboard."); } catch (e) { ta.focus(); ta.select(); toast("Select all and copy the text below."); }
}
let pendingImport = null;
function importCheck() {
  const box = $("#impConfirm");
  try { const o = JSON.parse($("#impText").value); if (!o || typeof o !== "object" || o.v !== 1 || typeof o.days !== "object") throw 0;
    pendingImport = o; const n = Object.keys(o.days || {}).length, f = Object.keys(o.found || {}).length;
    box.innerHTML = `<div class="confirm"><b>Replace your progress with this backup?</b><span class="small">It has ${n} roadmap days and ${f} Foundations items done${o.exportedAt ? ", exported " + esc(new Date(o.exportedAt).toLocaleString()) : ""}.</span><div class="row"><button class="btn danger" type="button" id="impYes">Replace progress</button><button class="btn" type="button" id="impNo">Cancel</button></div></div>`;
  } catch (e) { box.innerHTML = `<p class="small" style="color:var(--bad)">That isn't a tracker backup. Export one from this page, then paste or choose that file.</p>`; }
}

/* ---------- theme ---------- */
function applyTheme(m) { const r = document.documentElement; if (m === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", m); $("#themeBtn").textContent = "Theme: " + m[0].toUpperCase() + m.slice(1); }
function cycleTheme() { const cur = document.documentElement.getAttribute("data-theme") || "system"; const nx = cur === "system" ? "light" : cur === "light" ? "dark" : "system"; applyTheme(nx); try { localStorage.setItem(THEME_KEY, nx); } catch (e) {} }

/* ---------- boot ---------- */
try { applyTheme(localStorage.getItem(THEME_KEY) || "system"); } catch (e) { applyTheme("system"); }
const h0 = (location.hash || "").slice(1); view = Object.keys(state.activity).length ? "today" : "readme"; if (TABS.some(([k]) => k === h0)) view = h0;
setSync("local");
renderAll();
initSync();
</script>
